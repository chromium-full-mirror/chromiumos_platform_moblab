description   "Start the serice that is monitoring available container updates."
author        "chromium-os-dev@chromium.org"

start on started failsafe

respawn

normal exit 0

script
  set -x
  set -e

  LABEL=release
  REPO_ADDR=gcr.io/chromeos-partner-moblab
  WATCHTOWER_CMD="--enable-lifecycle-hooks --interval 3600 --monitor-only --include-restarting"

  if [ -e /etc/lsb-release ]; then
    track=$(cat /etc/lsb-release | \
            grep "CHROMEOS_RELEASE_TRACK" | \
            awk -F = '{ print $2 }')

    case $track in

      beta-channel)
        LABEL=beta
      ;;

      testimage-channel | dev-channel | developer-build )
        LABEL=autopush
        if [ -e /dev/disk/by-label/MOBLAB-DEV ] ; then
          mkdir -p /usr/local/tmp/moblab-dev
          umount /usr/local/tmp/moblab-dev || true
          mount $(readlink -f /dev/disk/by-label/MOBLAB-DEV) \
              /usr/local/tmp/moblab-dev || true
          LABEL=$(cat /usr/local/tmp/moblab-dev/devlabel || echo autopush)
          REPO_ADDR=$(cat /usr/local/tmp/moblab-dev/devrepo || echo "gcr.io/chromeos-partner-moblab")
          WATCHTOWER_CMD="--enable-lifecycle-hooks --interval 10 --include-restarting"
        fi
      ;;
    esac
  fi

  reps=0
  while [ ${reps} -lt 100 ] && ! docker info ; do
    : $((reps += 1))
    sleep 1
  done

  reps=0
  while [ ${reps} -lt 100 ] && \
        ! docker pull \
          "${REPO_ADDR}/watchtower:${LABEL}" ; do
    : $((reps += 1))
    sleep 1
  done

  docker run --rm --name watchtower \
    -v /var/run/docker.sock:/var/run/docker.sock \
    -d ${REPO_ADDR}/watchtower:${LABEL} ${WATCHTOWER_CMD}

end script
