description   "."
author        "chromium-os-dev@chromium.org"

# Disable OOM killer, critical for Moblab operation.
oom score never

start on (stopped moblab-network-init RESULT=ok and started failsafe)

respawn

normal exit 0

env DOCKER_CERT_PATH=/var/docker/certs

script
  mkdir -p /var/log/bootup/
  exec >>/var/log/bootup/${UPSTART_JOB}.log 2>&1
  set -x
  set +e

  APP_KEY="$(vpd -i RW_VPD -g application)"

  set -e

  # Hope to stop too many file handle open issues on docker
  # default was 1024 went 4x
  ulimit -n 16384

  # Migrate the docker data root away from moblab home directory but
  # keep on the stateful partition.  A bug was caused by setting the
  # ownership of all files in the moblab home directory.
  OLD_DOCKER_DATA_ROOT=/home/moblab/containers/docker
  DOCKER_DATA_ROOT=/var/docker/data
  mkdir -p "${DOCKER_DATA_ROOT}"
  if [ -d "${OLD_DOCKER_DATA_ROOT}/volumes" ] && [ ! -e "${DOCKER_DATA_ROOT}/volumes" ]
  then
    ln -s "${OLD_DOCKER_DATA_ROOT}/volumes" "${DOCKER_DATA_ROOT}/volumes"
    find "${OLD_DOCKER_DATA_ROOT}" -maxdepth 1 -not -name volumes -not -name docker -exec rm -rf {} \;
  fi

  mkdir -p /var/run/dockerd

  EXTRA_ARGS=""

  if [ "${APP_KEY}" = "satlab" ]; then
    DOCKER_IP=192.168.231.1
    DOCKER_PORT=2376
    DOCKER_HOST=tcp://${DOCKER_IP}:${DOCKER_PORT}
    mkdir -p ${DOCKER_CERT_PATH} # croslint: disable: docker expects specific location
    openssl genrsa \
      -aes256 \
      -out ${DOCKER_CERT_PATH}/ca-key.pem \
      -passout pass:pass 4096
    openssl rsa \
      -in ${DOCKER_CERT_PATH}/ca-key.pem \
      -passin pass:pass \
      -out ${DOCKER_CERT_PATH}/ca-key.pem
    openssl req \
      -new \
      -x509 \
      -days 365 \
      -key ${DOCKER_CERT_PATH}/ca-key.pem \
      -sha256 -out ${DOCKER_CERT_PATH}/ca.pem \
      -passin pass:pass \
      -subj "/C=US/ST=CA/L=SJC/O=Google/OU=DFP/CN=${DOCKER_IP}/emailAddress=email"
    openssl genrsa -out ${DOCKER_CERT_PATH}/server-key.pem 4096
    openssl req \
      -subj "/CN=${DOCKER_IP}" \
      -sha256 \
      -new \
      -key ${DOCKER_CERT_PATH}/server-key.pem \
      -out ${DOCKER_CERT_PATH}/server.csr
    echo subjectAltName = IP:${DOCKER_IP} > ${DOCKER_CERT_PATH}/extfile.cnf
    echo extendedKeyUsage = serverAuth >> ${DOCKER_CERT_PATH}/extfile.cnf
    openssl x509 \
      -req \
      -days 365 \
      -sha256 \
      -in ${DOCKER_CERT_PATH}/server.csr \
      -CA ${DOCKER_CERT_PATH}/ca.pem \
      -CAkey ${DOCKER_CERT_PATH}/ca-key.pem \
      -CAcreateserial \
      -out ${DOCKER_CERT_PATH}/server-cert.pem \
      -extfile ${DOCKER_CERT_PATH}/extfile.cnf \
      -passin pass:pass
    openssl genrsa -out ${DOCKER_CERT_PATH}/key.pem 4096
    openssl req \
      -subj '/CN=client' \
      -new \
      -key ${DOCKER_CERT_PATH}/key.pem \
      -out ${DOCKER_CERT_PATH}/client.csr
    echo extendedKeyUsage = clientAuth > ${DOCKER_CERT_PATH}/extfile-client.cnf
    openssl x509 \
      -req -days 365 \
      -sha256 \
      -in ${DOCKER_CERT_PATH}/client.csr \
      -CA ${DOCKER_CERT_PATH}/ca.pem \
      -CAkey ${DOCKER_CERT_PATH}/ca-key.pem \
      -CAcreateserial \
      -out ${DOCKER_CERT_PATH}/cert.pem \
      -extfile ${DOCKER_CERT_PATH}/extfile-client.cnf \
      -passin pass:pass
    rm ${DOCKER_CERT_PATH}/*.csr ${DOCKER_CERT_PATH}/*.cnf # croslint: disable: docker expects specific location
    chmod -v 0400 ${DOCKER_CERT_PATH}/ca-key.pem ${DOCKER_CERT_PATH}/server-key.pem # croslint: disable: docker expects specific location
    chmod -v 0444 ${DOCKER_CERT_PATH}/key.pem ${DOCKER_CERT_PATH}/ca.pem ${DOCKER_CERT_PATH}/server-cert.pem ${DOCKER_CERT_PATH}/cert.pem # croslint: disable: docker expects specific location

    EXTRA_ARGS="--tlsverify \
      --tlscacert=${DOCKER_CERT_PATH}/ca.pem \
      --tlscert=${DOCKER_CERT_PATH}/server-cert.pem \
      --tlskey=${DOCKER_CERT_PATH}/server-key.pem \
      -H ${DOCKER_HOST} \
      -H unix:///var/run/docker.sock"

    echo "DOCKER_CERT_PATH=${DOCKER_CERT_PATH}" > ${DOCKER_CERT_PATH}/.env
    echo "DOCKER_HOST=${DOCKER_HOST}" >> ${DOCKER_CERT_PATH}/.env
    echo "DOCKER_TLS_VERIFY=true" >> ${DOCKER_CERT_PATH}/.env
  fi
  /usr/bin/dockerd --data-root "${DOCKER_DATA_ROOT}" ${EXTRA_ARGS}

end script

# check that docker is actually running before the started event is emitted
post-start script
  while ! docker info ; do sleep 1 ; done

  # Use hello-world container to create a volume to store tls certs.
  id=$(docker container create -v docker_tls:/docker_tls hello-world)
  PEMS="ca cert key"
  for p in ${PEMS}; do
    docker cp ${DOCKER_CERT_PATH}/$p.pem $id:/docker_tls
  done
  docker rm $id
end script
