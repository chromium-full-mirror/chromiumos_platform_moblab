description   "If we detect an old pre-container version of moblab powerwash."
author        "chromium-os-dev@chromium.org"

start on started failsafe

respawn

normal exit 0

script
    REPO_ADDR=gcr.io/chromeos-partner-moblab

    if [ -e /etc/lsb-release ]; then
    track=$(cat /etc/lsb-release | \
            grep "CHROMEOS_RELEASE_TRACK" | \
            awk -F = '{ print $2 }')

    if [ -d "/usr/local/autotest" ] && [ "${track}" != "testimage-channel"]; then
        echo "safe fast keepimg" > /mnt/stateful_partition/factory_install_reset
        reboot
    fi
end script
