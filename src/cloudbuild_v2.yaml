substitutions:
  _BASE_REGISTRY_URI: us-docker.pkg.dev/chromeos-partner-moblab/base-containers
  _REGISTRY_URI: gcr.io/chromeos-partner-moblab
  _LABEL: beta
  _WATCHTOWER_CMD: "--interval 3600 --monitor-only --include-restarting"
  _SSH_PORT: "22"
  
  _BUILD_VERSION: "invalid"
  _DB_VER: "undef"
  _DB_INIT_VER: "undef"
  _DB_SETUP_VER: "undef"
  _DEVSERVER_VER: "undef"
  _AUTOTEST_AFE_VER: "undef"
  _AT_DBSETUP_VER: "undef"
  _AT_MONITORDB_VER: "undef"
  _AT_HOSTSCHEDULER_VER: "undef"
  _AT_JOBABORTER_VER: "undef"
  _MOBLAB_UI_VER: "undef"
  _MOBLAB_RPCSERVER_VER: "undef"
  _REMOTE_AGENT_VER: "undef"
  _OFFLOADER_VER: "undef"
  _REMOTE_SCHEDULER_VER: "undef"
  _REMOTE_ACCESS_VER: "undef"
  _ENVOYPROXY_VER: "undef"
  _WATCHTOWER_VER: "undef"
  _MOBMONITOR_VER: "undef"
  _DNS_VER: "undef"
  _LOGROTATE_VER: "undef"


steps:
  - id: buster-slim
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/debian:buster-slim"]
    waitFor: ['-']
  - id: alpine-git
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/alpine/git"]
    waitFor: ['-']
  - id: dockerfile-copy
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/docker/dockerfile-copy:v0.1.9"]
    waitFor: ['-']
  - id: buster
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/debian:buster"]
    waitFor: ['-']
  - id: python-3.7-slim
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/python:3.7-slim-buster"]
    waitFor: ['-']
  - id: python-3.7
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/python:3.7-buster"]
    waitFor: ['-']
  - id: mariadb
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/mariadb:10.5"]
    waitFor: ['-']
  - id: python-3.8-slim
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/python:3.8-slim-buster"]
    waitFor: ['-']
  - id: python-3.8
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/python:3.8-buster"]
    waitFor: ['-']
  - id: envoyproxy
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/envoyproxy/envoy:v1.15.2"]
    waitFor: ['-']
  - id: openssh-server
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/linuxserver/openssh-server"]
    waitFor: ['-']
  - id: watchtower
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/v2tec/watchtower:latest"]
    waitFor: ['-']
  - id: docker-compose
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/docker/compose:alpine-1.27.4"]
    waitFor: ['-']
  - id: node-buster
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/node:15-buster"]
    waitFor: ['-']
  - id: node15
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/node:15"]
    waitFor: ['-']
  - id: alpine-edge
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/alpine:edge"]
    waitFor: ['-']
  - id: nginx-alpine
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/nginx:alpine"]
    waitFor: ['-']
  - id: python-2
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/python:2-buster"]
    waitFor: ['-']
  - id: blacklabelops_logrotate
    name: "docker:19.03.8"
    args: ["pull", "${_BASE_REGISTRY_URI}/blacklabelops/logrotate:latest"]
    waitFor: ['-']


  - id: protoc
    name: "docker:19.03.8"
    args:
      [
        "build",
        "-f",
        "/workspace/src/dockerfiles/utilities/Dockerfile.protoc",
        "-t",
        "${_REGISTRY_URI}/protoc:${_BUILD_VERSION}",
        "/workspace/src/dockerfiles/utilities/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "buster-slim"

  - id: chromite
    name: "docker:19.03.8"
    args:
      [
        "build",
        "-f",
        "/workspace/src/dockerfiles/utilities/Dockerfile.chromite",
        "-t",
        "${_REGISTRY_URI}/chromite:${_BUILD_VERSION}",
        "/workspace/src/dockerfiles/utilities/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "alpine-git"

  - id: protogen
    name: "${_REGISTRY_URI}/protoc:${_BUILD_VERSION}"
    entrypoint: "bash"
    args: ["/workspace/src/moblab_common/protos/protogen.sh"]
    waitFor:
      - "protoc"

  - id: protogen-ui
    name: "${_REGISTRY_URI}/protoc:${_BUILD_VERSION}"
    entrypoint: "bash"
    args: ["/workspace/src/moblab-ui/protogen_ui.sh"]
    waitFor:
      - "protoc"

  - id: moblab_common
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/moblab_common/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab_common:${_BUILD_VERSION}",
        "/workspace/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "protogen"
      - "python-2"
      - "buster-slim"
      - "python-3.8"

  - id: moblab_db_setup
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/moblab_common/Dockerfile.dbsetup",
        "-t",
        "${_REGISTRY_URI}/moblab-db-setup:${_BUILD_VERSION}",
        "/workspace/src/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "python-3.8"

  - id: autotest-lucifer
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.lucifer",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-lucifer:${_BUILD_VERSION}",
        "/workspace/src/dockerfiles/autotest/",
      ]
    waitFor:
      - "protoc"
      - "alpine-git"
      - "buster-slim"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-base
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.base",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-base:${_BUILD_VERSION}",
        "/workspace/",
      ]
    waitFor:
      - "protoc"
      - "alpine-git"
      - "buster-slim"
      - "python-3.7-slim"
      - "moblab_common"
      - "chromite"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-afe
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.afe",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-afe:${_BUILD_VERSION}",
        "/workspace/src/dockerfiles/autotest",
      ]
    waitFor:
      - "autotest-base"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-dbsetup
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.dbsetup",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-dbsetup:${_BUILD_VERSION}",
        "/workspace/src/dockerfiles/autotest",
      ]
    waitFor:
      - "autotest-base"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-monitor
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.monitor_db",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-monitor_db:${_BUILD_VERSION}",
        "/workspace/src/dockerfiles/autotest",
      ]
    waitFor:
      - "autotest-base"
      - "autotest-lucifer"
      - "alpine-git"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-host
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.hostscheduler",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-host:${_BUILD_VERSION}",
        "/workspace/src/dockerfiles/autotest",
      ]
    waitFor:
      - "autotest-base"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-abort
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.job_aborter",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-aborter:${_BUILD_VERSION}",
        "/workspace/src/dockerfiles/autotest",
      ]
    waitFor:
      - "autotest-base"
      - "alpine-git"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: db
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/db/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-db:${_BUILD_VERSION}",
        "/workspace/src/dockerfiles/db",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "mariadb"

  - id: db-init
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/db/Dockerfile.db_init",
        "-t",
        "${_REGISTRY_URI}/moblab-db-init:${_BUILD_VERSION}",
        "/workspace/src/dockerfiles/db",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "buster-slim"

  - id: devserver
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/devserver/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/devserver:${_BUILD_VERSION}",
        "/workspace/src/dockerfiles/devserver",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "alpine-git"
      - "python-3.8-slim"
      - "chromite"

  - id: ui
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/ui/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-ui:${_BUILD_VERSION}",
        "/workspace/src/",
      ]
    waitFor:
      - "protogen-ui"
      - "node15"
      - "nginx-alpine"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: ssp
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/ssp/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-ssp:${_BUILD_VERSION}",
        "/workspace/src/dockerfiles/ssp",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "buster-slim"
      - "alpine-git"
      - "chromite"
      
  - id: offloader
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/offloader/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-offloader:${_BUILD_VERSION}",
        "/workspace/",
      ]
    waitFor:
      - "protoc"
      - "python-3.8"
      - "python-3.8-slim"
      - "moblab_common"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: envoy
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/envoy/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/envoy-proxy:${_BUILD_VERSION}",
        "/workspace/src/dockerfiles/envoy",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "envoyproxy"

  - id: remote-agent
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/remote_agent/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-remote-agent:${_BUILD_VERSION}",
        "/workspace/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "python-3.8"
      - "python-3.8-slim"
      - "moblab_common"

  - id: remote-scheduler
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/remote-scheduler/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-remote-scheduler:${_BUILD_VERSION}",
        "/workspace/",
      ]
    waitFor:
      - "python-3.8"
      - "python-3.8-slim"
      - "moblab_common"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: rpcserver
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/rpcserver/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-rpcserver:${_BUILD_VERSION}",
        "/workspace/",
      ]
    waitFor:
      - "python-3.8"
      - "python-3.8-slim"
      - "moblab_common"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: compose
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg", "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg", "LABEL=${_BUILD_VERSION}",
        "--build-arg", "SSH_PORT=${_SSH_PORT}",

        "--build-arg", "BUILD_VERSION=${_BUILD_VERSION}",
        "--build-arg", "DB_VER=${_DB}",
        "--build-arg", "DB_INIT_VER=${_DB_INIT}",
        "--build-arg", "DB_SETUP_VER=${_DB_SETUP}",
        "--build-arg", "DEVSERVER_VER=${_DEVSERVER}",
        "--build-arg", "AUTOTEST_AFE_VER=${_AUTOTEST_AFE}",
        "--build-arg", "AT_DBSETUP_VER=${_AT_DBSETUP}",
        "--build-arg", "AT_MONITORDB_VER=${_AT_MONITORDB}",
        "--build-arg", "AT_HOSTSCHEDULER_VER=${_AT_HOSTSCHEDULER}",
        "--build-arg", "AT_JOBABORTER_VER=${_AT_JOBABORTER}",
        "--build-arg", "MOBLAB_UI_VER=${_MOBLAB_UI}",
        "--build-arg", "MOBLAB_RPCSERVER_VER=${_MOBLAB_RPCSERVER}",
        "--build-arg", "REMOTE_AGENT_VER=${_REMOTE_AGENT}",
        "--build-arg", "OFFLOADER_VER=${_OFFLOADER}",
        "--build-arg", "REMOTE_SCHEDULER_VER=${_REMOTE_SCHEDULER}",
        "--build-arg", "REMOTE_ACCESS_VER=${_REMOTE_ACCESS}",
        "--build-arg", "ENVOYPROXY_VER=${_ENVOYPROXY}",
        "--build-arg", "WATCHTOWER_VER=${_WATCHTOWER}",
        "--build-arg", "MOBMONITOR_VER=${_MOBMONITOR}",
        "--build-arg", "DNS_VER=${_DNS}",
        "--build-arg", "LOGROTATE_VER=${_LOGROTATE}",

        "--label=version=${_BUILD_VERSION}",

        "-f", "/workspace/src/dockerfiles/compose/Dockerfile",
        "-t", "${_REGISTRY_URI}/moblab-compose:${_BUILD_VERSION}",
        "-t", "${_REGISTRY_URI}/moblab-compose:${_LABEL}",

        "/workspace/src/dockerfiles/compose",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
      - "WATCHTOWER_CMD=${_WATCHTOWER_CMD}"
    waitFor:
      - "docker-compose"

  - id: mobmonitor
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/mobmonitor/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/mobmonitor:${_BUILD_VERSION}",
        "/workspace/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "node15"
      - "python-3.8-slim"
      - "moblab_common"

  - id: dns
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/dns/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-dns:${_BUILD_VERSION}",
        "/workspace/src/dockerfiles/dns",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "alpine-edge"

  - id: remote_access
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_BUILD_VERSION}",
        "-f",
        "/workspace/src/dockerfiles/remote_access/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/remote_access:${_BUILD_VERSION}",
        "/workspace/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "dockerfile-copy"
      - "openssh-server"
      - "autotest-base"
      - "moblab_common"

  - id: logrotate
    name: "docker:19.03.8"
    args:
      [
        "build",
        "-f",
        "/workspace/src/dockerfiles/utilities/Dockerfile.logrotate",
        "-t",
        "${_REGISTRY_URI}/logrotate:${_BUILD_VERSION}",
        "/workspace/src/dockerfiles/utilities/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "blacklabelops_logrotate"

images:
  [
    "${_REGISTRY_URI}/protoc:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-autotest-lucifer:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-autotest-base:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-autotest-dbsetup:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-autotest-monitor_db:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-autotest-host:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-autotest-aborter:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-compose:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-compose:${_LABEL}",
    "${_REGISTRY_URI}/moblab-rpcserver:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-remote-scheduler:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-remote-agent:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/remote_access:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/envoy-proxy:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-offloader:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-ui:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/devserver:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-db-init:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-db:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-db-setup:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-autotest-afe:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-ssp:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/mobmonitor:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab-dns:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/moblab_common:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/logrotate:${_BUILD_VERSION}",
    "${_REGISTRY_URI}/chromite:${_BUILD_VERSION}",
  ]

options:
  # Use higher CPU machines so the caching and build steps are faster.
  machineType: "N1_HIGHCPU_32"
