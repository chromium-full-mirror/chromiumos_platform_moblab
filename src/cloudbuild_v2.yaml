  - id: protoc
    name: "docker:20.10.6"
    args:
      [
        "build",
        "-f",
        "/workspace/src/dockerfiles/utilities/Dockerfile.protoc",
        "-t",
        "${_REGISTRY_URI}/protoc:${__BUILD_VERSION}",
        "/workspace/src/dockerfiles/utilities/",
        "--build-arg",
        "${_INLINE_CACHE}",
        "--cache-from",
        "${_REGISTRY_URI}/protoc:${__BUILD_VERSION}",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "buster-slim"
