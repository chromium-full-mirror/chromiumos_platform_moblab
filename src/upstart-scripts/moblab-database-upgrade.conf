description   "Configure the database for moblab"
author        "chromium-os-dev@chromium.org"

start on stopped moblab-autotest-setup
normal exit 0

task

script
  SLEEP_TIME=3
  LOOP_MAX=10
  mkdir -p /var/log/bootup/
  exec >>/var/log/bootup/${UPSTART_JOB}.log 2>&1
  set -x
  set -e
  logger -t "${UPSTART_JOB}" "Starting."
  # Upgrade to maria 10.2 and the new database engine
  # Remove after most devices have upgraded past M77
  if [ -d /var/lib/mysql ] && [ ! -e /usr/local/moblab/upgrade123 ]; then
    mkdir -p /var/run/mysqld
    chown mysql:mysql /var/run/mysqld
    passwd=$(sed -n '/^password: /{s,^[^:]*: *,,p;q}' \
       /usr/local/autotest/shadow_config.ini)
    if [ -z "$passwd" ]; then
    passwd=$(sed -n '/^password = /{s,^[^=]*= *,,p;q}' \
       /usr/local/autotest/shadow_config.ini)
    fi
    # Regular upgrade
    /usr/sbin/mysqld  \
      --defaults-extra-file=/etc/moblab/mysql/mysql_defaults_extra.cnf &
    counter=0
    while [ ! -e /var/run/mysqld/mysqld.sock ] && \
            [ ${counter} -lt ${LOOP_MAX} ]; do
      logger -t "$UPSTART_JOB" "mysqld not up."
      sleep ${SLEEP_TIME}
      counter=$(expr ${counter} + 1)
    done
    mysql_upgrade -uroot -p"${passwd}" || true
    timeout -s SIGKILL 5 mysqladmin shutdown -uroot -p"${passwd}" || true


    # Recovery upgrade
    /usr/sbin/mysqld \
      --defaults-extra-file=/etc/moblab/mysql/mysql_defaults_extra.cnf \
      --innodb_force_recovery=4&
    counter=0
    while [ ! -e /var/run/mysqld/mysqld.sock ] && \
            [ ${counter} -lt ${LOOP_MAX} ]; do
      logger -t "$UPSTART_JOB" "mysqld not up."
      sleep ${SLEEP_TIME}
      counter=$(expr ${counter} + 1)
    done
    mysql_upgrade -uroot -p"${passwd}" || true
    timeout -s SIGKILL 5 mysqladmin shutdown -uroot -p"${passwd}" || true

    # Regular upgrade
    /usr/sbin/mysqld  \
      --defaults-extra-file=/etc/moblab/mysql/mysql_defaults_extra.cnf &
    counter=0
    while [ ! -e /var/run/mysqld/mysqld.sock ] && \
            [ ${counter} -lt ${LOOP_MAX} ]; do
      logger -t "$UPSTART_JOB" "mysqld not up."
      sleep ${SLEEP_TIME}
      counter=$(expr ${counter} + 1)
    done
    mysql_upgrade -uroot -p"${passwd}" || true
    timeout -s SIGKILL 5 mysqladmin shutdown -uroot -p"${passwd}" || true

  fi
  mkdir -p /usr/local/moblab
  touch /usr/local/moblab/upgrade123
end script
