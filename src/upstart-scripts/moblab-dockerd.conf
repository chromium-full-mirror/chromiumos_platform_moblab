description   "."
author        "chromium-os-dev@chromium.org"

start on started failsafe

respawn

normal exit 0

script
  mkdir -p /var/log/bootup/
  exec >>/var/log/bootup/${UPSTART_JOB}.log 2>&1
  set -x
  set -e
  # Hope to stop too many file handle open issues on docker
  # default was 1024 went 4x
  ulimit -n 16384
  mkdir -p /var/run/dockerd
  mkdir -p /home/moblab/containers/docker
  chown -R moblab:moblab /home/moblab
  /usr/bin/dockerd --data-root /home/moblab/containers/docker
end script

