description   "."
author        "chromium-os-dev@chromium.org"

start on started failsafe

respawn

normal exit 0

script
  mkdir -p /var/log/bootup/
  exec >>/var/log/bootup/${UPSTART_JOB}.log 2>&1
  set -x
  set -e
  REPO_ADDR=""
  EXTRA_ARGS=""
  if [ -e /etc/lsb-release ]; then
    track=$(cat /etc/lsb-release | \
            grep "CHROMEOS_RELEASE_TRACK" | \
            awk -F = '{ print $2 }')

    case $track in
      testimage-channel | dev-channel)
        if [ -e /dev/disk/by-label/MOBLAB-DEV ] ; then
          mkdir -p /usr/local/tmp/moblab-dev
          umount /usr/local/tmp/moblab-dev || true
          mount $(readlink -f /dev/disk/by-label/MOBLAB-DEV) \
              /usr/local/tmp/moblab-dev || true
          REPO_ADDR=$(cat /usr/local/tmp/moblab-dev/devrepo || echo "")
        fi
      ;;
    esac
  fi
  EXTRA_ARGS=""
  if [ ! -z "${REPO_ADDR}" ]; then
    EXTRA_ARGS="${EXTRA_ARGS} --insecure-registry ${REPO_ADDR}"
  fi


  # Hope to stop too many file handle open issues on docker
  # default was 1024 went 4x
  ulimit -n 16384
  mkdir -p /var/run/dockerd
  mkdir -p /home/moblab/containers/docker
  chown -R moblab:moblab /home/moblab
  /usr/bin/dockerd --data-root /home/moblab/containers/docker ${EXTRA_ARGS}
end script
