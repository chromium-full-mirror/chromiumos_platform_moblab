description   "Kick off the moblab_results_uploader to clean up the results folder."
author        "chromium-os-dev@chromium.org"

start on ( started moblab-scheduler-init and
           stopped moblab-gsoffloader-init and
           stopped moblab-gsoffloader_s-init)
respawn
post-stop exec sleep 5

normal exit 0

pre-start script
    test -f /mnt/stateful_partition/.new_results_uploader || ( stop; exit 0 )
end script

exec sudo -u moblab \
    /etc/moblab/moblab_results_uploader/moblab_results_uploader \
    --log-file /var/log/moblab/results_uploader.log \
    --uploading-filter-config-file /etc/moblab/moblab_results_uploader/test_results_uploading_filter.yaml \
    run \
    --credentials-file /home/moblab/.service_account.json \
    --min-age-to-upload 0 \
    --min-age-to-prune 3 \
    --timeout-days 3 \
    --jobs 3
