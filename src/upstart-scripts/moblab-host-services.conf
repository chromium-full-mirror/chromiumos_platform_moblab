description   "Start serice that bridges the host to containers."
author        "chromium-os-dev@chromium.org"

start on started failsafe

respawn

normal exit 0

script
  mkdir -p /var/log/bootup/
  exec >>/var/log/bootup/${UPSTART_JOB}.log 2>&1
  set -x
  set -e
  mkdir -p /var/log/moblab
  /etc/moblab/host-services/host-server.py
end script

