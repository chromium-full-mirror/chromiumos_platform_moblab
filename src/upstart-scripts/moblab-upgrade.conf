description   "If we detect an old pre-container version of moblab powerwash."
author        "chromium-os-dev@chromium.org"

start on started failsafe

respawn

normal exit 0

script

if [ -d "/usr/local/autotest" ]; then
    echo "safe fast keepimg" > /mnt/stateful_partition/factory_install_reset
    reboot
fi

end script
