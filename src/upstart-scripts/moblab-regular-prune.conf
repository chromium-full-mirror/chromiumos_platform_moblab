description   "Free up any images or networks that are not currently used."
author        "chromium-os-dev@chromium.org"

start on started dockerd

respawn

normal exit 0

script
  mkdir -p /var/log/bootup/
  exec >>/var/log/bootup/${UPSTART_JOB}.log 2>&1
  set -x
  set -e
  while true; do sleep 600; docker system prune -f; done
end script

