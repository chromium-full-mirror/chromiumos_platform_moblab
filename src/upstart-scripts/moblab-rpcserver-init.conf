description   "Kick off the gs_offloader to clean up the results folder."
author        "chromium-os-dev@chromium.org"

start on started moblab-scheduler-init
respawn

normal exit 0

script
  mkdir -p /var/log/bootup/
  exec >>/var/log/bootup/${UPSTART_JOB}.log 2>&1
  set -x
  set -e
  mkdir -p /var/log/moblab/
  touch /var/log/moblab/moblab_rpc.log
  chown moblab /var/log/moblab/moblab_rpc.log
  sudo -u moblab python /etc/moblab/moblab-rpcserver/moblab-rpcserver.py
end script

