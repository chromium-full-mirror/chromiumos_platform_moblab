description   "Start the moblab application, a set of docker containers."
author        "chromium-os-dev@chromium.org"

start on started moblab-dockerd

script
  mkdir -p /var/log/bootup/
  exec >>/var/log/bootup/${UPSTART_JOB}.log 2>&1
  set -x
  set -e

  LABEL=release

  if [ -e /etc/lsb-release ]; then
    track=$(cat /etc/lsb-release | \
            grep "CHROMEOS_RELEASE_TRACK" | \
            awk -F = '{ print $2 }')

    case $track in

      beta-channel)
        LABEL=beta
      ;;

      testimage-channel | dev-channel)
        if [ -e /dev/disk/by-label/MOBLAB-DEV ] ; then
          mkdir -p /usr/local/tmp/moblab-dev
          umount /usr/local/tmp/moblab-dev || true
          mount $(readlink -f /dev/disk/by-label/MOBLAB-DEV) \
              /usr/local/tmp/moblab-dev || true
          LABEL=$(cat /usr/local/tmp/moblab-dev/devlabel || echo release)
        fi
      ;;
    esac
  fi

  reps=0
  while [ ${reps} -lt 100 ] && ! docker info ; do
    : $((reps += 1))
    sleep 1
  done

  reps=0
  while [ ${reps} -lt 100 ] && \
        ! docker pull \
          "gcr.io/chromeos-partner-moblab/moblab-compose:${LABEL}" ; do
    : $((reps += 1))
    sleep 1
  done

  UP_FLAGS=""
  if [ "${LABEL}" != "release" ]; then UP_FLAG="-i"; fi

  docker system prune -f
  docker run --rm --name compose-pull \
    -v /var/run/docker.sock:/var/run/docker.sock -i \
    -e LABEL=${LABEL} \
    "gcr.io/chromeos-partner-moblab/moblab-compose:${LABEL}" pull
  docker run --rm --name compose \
    -v /var/run/docker.sock:/var/run/docker.sock ${UP_FLAG} \
    -e LABEL=${LABEL} \
    "gcr.io/chromeos-partner-moblab/moblab-compose:${LABEL}" up
end script

