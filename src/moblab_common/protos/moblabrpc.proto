}

// NEXT_TAG = 8
message RunCtsSuiteRequest {
  string android_version = 1;
  string build_target = 2;
  string build_version = 3;
  string milestone = 4;
  string model = 5;
  string pool = 6;
  // Comma separated list of modules which, if specified, will be the only
  // CTS suite modules to be run.
  repeated string specific_modules = 7;
}

// NEXT_TAG = 7
message RunGtsSuiteRequest {
  string build_target = 1;
  string build_version = 2;
  string model = 3;
  string milestone = 4;
  string pool = 5;
  // Comma separated list of modules which, if specified, will be the only
