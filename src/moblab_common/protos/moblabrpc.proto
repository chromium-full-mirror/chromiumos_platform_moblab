}

// NEXT_TAG = 11;
message RunStorageQualificationSuiteRequest {
  // NEXT_TAG = 8;
  enum Variation {
    VARIATION_NOT_SET = 0;
    QUICK = 1;
    REMOVABLE = 2;
    QUICK_V2 = 3;
    XS = 4;
    S = 5;
    M = 6;
    L = 7;
    XL = 8;
  }
  string build_target = 1;
  string build_version = 2;
  string model = 3;
  string milestone = 4;
  string pool = 5;
  string avl_process_bug_id = 6;
  string avl_part_number = 7;
  Variation variation = 8;
  int32 disk_size_gb = 9;
  bool is_dual_namespace = 10;
}

// NEXT_TAG = 8
message RunMemoryQualificationSuiteRequest {
  string build_target = 1;
  string build_version = 2;
  string model = 3;
  string milestone = 4;
  string pool = 5;
  string avl_process_bug_id = 6;
  string avl_part_number = 7;
}

// NEXT_TAG = 17
message ConnectedDutInfo {
  string name = 1;
  string ip = 2;
  string mac_addr = 3;
  // TODO (chromium:1168372): Change the DUT status type from String to Enum.
  string status = 4;
  string build_target = 5;
  string model  = 6;
  bool is_enrolled = 7;
  bool is_locked = 8;
  bool is_connected = 16;
  string lock_reason = 9;
  repeated string labels = 10;
  repeated string attributes= 11;
  repeated string pools= 12;
  string error = 13;
  int32 current_job = 14;
  // e.g., repairs, reverifies
  string current_dut_task = 15;
}
message ListConnectedDutsRequest {
}

// NEXT_TAG = 2
message ListConnectedDutsResponse {
  repeated ConnectedDutInfo duts = 1;
}

