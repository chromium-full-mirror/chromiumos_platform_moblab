syntax = "proto3";

package moblab;

import "google/protobuf/empty.proto";

service MoblabRpcService {
  // Run a test suite
  rpc run_suite (RunSuiteRequest) returns (RunSuiteResponse) {}
  rpc run_cts_suite (RunCtsSuiteRequest) returns (RunSuiteResponse) {}
  rpc run_gts_suite (RunGtsSuiteRequest) returns (RunSuiteResponse) {}
  rpc run_storage_qualification_suite (RunStorageQualificationSuiteRequest)
    returns (RunSuiteResponse) {}
  rpc run_memory_qualification_suite (RunMemoryQualificationSuiteRequest)
    returns (RunSuiteResponse) {}
  rpc provision_duts (ProvisionDutsRequest) returns (google.protobuf.Empty) {}

  rpc list_connected_duts (ListConnectedDutsRequest) returns (ListConnectedDutsResponse) {}
  rpc list_build_targets (ListBuildTargetsRequest) returns (ListBuildTargetsResponse) {}
  rpc list_milestones (ListMilestonesRequest) returns (ListMilestonesResponse) {}
  rpc list_build_versions (ListBuildVersionsRequest) returns (ListBuildVersionsResponse) {}
  rpc list_models (ListModelsRequest) returns (ListModelsResponse) {}
  rpc list_pools (ListPoolsRequest) returns (ListPoolsResponse) {}

  rpc enroll_duts (EnrollDutsRequest) returns (EnrollDutsResponse) {}
  rpc unenroll_duts (EnrollDutsRequest) returns (EnrollDutsResponse) {}

  rpc list_connected_duts_firmware(ListConnectedDutsFirmwareRequest) returns (ListConnectedDutsFirmwareResponse) {}
  rpc update_duts_firmware(UpdateDutsFirmwareRequest) returns (UpdateDutsFirmwareResponse) {}

  rpc get_num_jobs(GetNumJobsRequest) returns (GetNumJobsResponse)  {}
  rpc get_jobs(GetJobsRequest) returns (GetJobsResponse)  {}
  rpc get_job_ids(GetJobIdsRequest) returns (GetJobIdsResponse)  {}
  rpc get_job_details(GetJobDetailsRequest) returns (GetJobDetailsResponse)  {}

  rpc abort_jobs(AbortJobsRequest) returns (AbortJobsResponse)  {}

  rpc get_dut_details(GetDutDetailsRequest) returns (GetDutDetailsResponse)  {}
  rpc get_num_dut_tasks(GetNumDutTasksRequest) returns (GetNumDutTasksResponse) {}
  rpc get_dut_tasks(GetDutTasksRequest) returns (GetDutTasksResponse) {}

  rpc reverify_host(ReverifyHostRequest) returns (ReverifyHostResponse) {};
  rpc repair_host(RepairHostRequest) returns (RepairHostResponse) {};

  rpc reboot_moblab(RebootMoblabRequest) returns (RebootMoblabResponse) {};
  rpc get_is_update_available(GetIsUpdateAvailableRequest) returns (GetIsUpdateAvailableResponse) {};
  rpc update_moblab(UpdateMoblabRequest) returns (UpdateMoblabResponse) {};

  rpc add_label_to_duts(AddLabelToDutsRequest) returns (AddLabelToDutsResponse) {};
  rpc remove_label_from_duts(RemoveLabelFromDutsRequest) returns (RemoveLabelFromDutsResponse) {};
  rpc add_pool_to_duts(AddPoolToDutsRequest) returns (AddPoolToDutsResponse) {};
  rpc remove_pool_from_duts(RemovePoolFromDutsRequest) returns (RemovePoolFromDutsResponse) {};
  rpc add_attribute_to_duts(AddAttributeToDutsRequest) returns (AddAttributeToDutsResponse) {};
  rpc remove_attribute_from_duts(RemoveAttributeFromDutsRequest) returns (RemoveAttributeFromDutsResponse) {};

  rpc get_network_info(GetNetworkInfoRequest) returns (GetNetworkInfoResponse) {};
  rpc get_cloud_configuration(GetCloudConfigurationRequest) returns (GetCloudConfigurationResponse) {};
  rpc set_cloud_configuration(SetCloudConfigurationRequest) returns (SetCloudConfigurationResponse) {};
  rpc get_dut_wifi_info(GetDutWifiInfoRequest) returns (GetDutWifiInfoResponse) {};
  rpc set_dut_wifi_info(SetDutWifiInfoRequest) returns (SetDutWifiInfoResponse) {};
  rpc get_version_info(GetVersionInfoRequest) returns (GetVersionInfoResponse) {};
  rpc get_remote_agent_configuration(GetRemoteAgentConfigurationRequest) returns (GetRemoteAgentConfigurationResponse) {};
  rpc set_remote_agent_configuration(SetRemoteAgentConfigurationRequest) returns (SetRemoteAgentConfigurationResponse) {};

  // Sends screenshot and feedback information to GCS bucket.
  rpc send_moblab_screenshot(SendMoblabScreenshotRequest) returns (SendMoblabScreenshotResponse) {};

  rpc download_service_account(google.protobuf.Empty) returns (google.protobuf.Empty) {};

  rpc validate_storage_qual_setup(ValidateStorageQualSetupRequest) returns (google.protobuf.Empty) {};
}


// NEXT_TAG = 4
message SendMoblabScreenshotRequest {
  string contact_email = 3;
  // Text description of issue motivating screenshot submission.
  string description = 1;
  // Serialized Base64 png image.
  string screenshot = 2;
}

// NEXT_TAG = 2
message SendMoblabScreenshotResponse {
  // Text response message indicating success of submission and where screenshot
  // has been uploaded.
  string message = 1;
}

// NEXT_TAG = 7
message RunSuiteRequest {
  string suite = 1;
  string build_target = 2;
  string milestone = 3;
  string build_version = 4;
  string model = 5;
  string pool = 6;
}

// NEXT_TAG = 2
message RunSuiteResponse {
  string message = 1;
}

// NEXT_TAG = 4
message ProvisionDutsRequest {
  string milestone = 1;
  string build_version = 2;
