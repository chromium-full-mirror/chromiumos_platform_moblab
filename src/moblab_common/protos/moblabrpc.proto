// NEXT_TAG = 9
message Execution {
  string name = 1;
  int32 job_id = 2;
  int64 start_time_utc = 3;
  int64 end_time_utc = 4;
  int64 used_time = 5;
  Job.JobStatus status = 6;
  string dut = 7;
  string dut_status = 8;
}

// NEXT_TAG = 17
message Job {
  // NEXT_TAG = 90
  enum Priority {
    PRIORITY_NOT_SET = 0;
    WEEKLY = 10;
    DAILY = 20;
    POST_BUILD = 30;
    DEFAULT = 40;
    BUILD = 50;
    PFQ = 60;
    CQ = 70;
    SUPER = 80;
  }

  // NEXT_TAG = 3
  enum Relationship {
    RELATIONSHIP_NOT_SET = 0;
    SUITE = 1;
    CHILD = 2;
  }

  // NEXT_TAG = 19
  enum JobStatus {
    STATUS_NOT_SET = 0;
    CREATED = 1;
    QUEUED = 2;
    PROVISIONING = 3;
    RUNNING = 4;
    SUCCESS = 5;
    FAILED = 6;
    TIMED_OUT = 7;
    ABORTED = 8;
    ABORTING = 9;
    STARTING = 10;
    PENDING = 11;
    RESETTING = 12;
    VERIFYING = 13;
    GATHERING = 14;
    PARSING = 15;
    STOPPED = 16;
    CLEANING = 17;
    TEMPLATE = 18;
  }

  // NEXT_TAG = 6
  enum UploadStatus {
    UPLOAD_STATUS_UNKNOWN = 0;
    UPLOAD_STATUS_NOT_READY = 1;
    UPLOAD_STATUS_QUEUED = 2;     // hourglass_empty
    UPLOAD_STATUS_UPLOADING = 3;
    UPLOAD_STATUS_UPLOADED = 4;   // done
    UPLOAD_STATUS_UPLOAD_FAILED = 5;
    UPLOAD_STATUS_DELETED = 6;
  }

  // NEXT_TAG = 4
  message UploadState {
    UploadStatus status = 1;
    string last_error = 2;
    int32 attempts_number = 3;
  }

  // NEXT_TAG = 4
  enum QueueStatus {
    QUEUE_STATUS_NOT_SET = 0;
    QUEUED_JOBS = 1;
    JOBS_RUNNING = 2;
    FINISHED_JOBS = 3;
  }

  int32 job_id = 1;
  string name = 2;
  Priority priority = 3;
  int64 created_time_sec_utc = 4;
  int64 start_time_sec_utc = 5;
  int64 finished_time_sec_utc = 6;
  JobStatus status = 7;
  int32 parent_job_id = 8;

  // Parameters below are meant to only be defined in job details page.
  string dependencies = 9;
  string server_control_file = 10;
  int64 timeout = 11;
  int64 max_runtime = 12;
  int32 test_retries = 13;
  repeated Execution execution_history = 14;
  repeated Execution associated_duts = 15;

  UploadState upload_state = 16;
}

// NEXT_TAG = 11
message GetNumJobsRequest {
  string id_filter = 3;
  string name_filter = 4;
  // Timestamp int's are in second granularity.
  int64 created_time_lt = 5;
  int64 created_time_gt = 6;
  Job.QueueStatus status_filter = 7;
  // Relationship denotes whether a job is a parent/suite or child.
  Job.Relationship rel_filter = 8;
  string parent_id_filter = 9;
  string dut_hostname_filter = 10;
}

// NEXT_TAG = 2
message GetNumJobsResponse {
  int32 num_jobs = 1;
}

