<mat-card>
<mat-tab-group>
<mat-tab label="Enrollment">

<mat-card>
<button mat-raised-button>Select All Unenrolled</button>
</mat-card>

<mat-card>
<div class="example-container">
<table mat-table [dataSource]="duts">

<ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
            <mat-checkbox >
            </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
            <mat-checkbox >
            </mat-checkbox>
        </td>
</ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let element"> {{element.getIp()}} </td>
  </ng-container>


  <ng-container matColumnDef="board">
    <th mat-header-cell *matHeaderCellDef> Board </th>
    <td mat-cell *matCellDef="let element"> {{element.getBoardsList()}} </td>
  </ng-container>

  <ng-container matColumnDef="model">
        <th mat-header-cell *matHeaderCellDef> Model </th>
        <td mat-cell *matCellDef="let element"> {{element.getModelsList()}} </td>
  </ng-container>

  <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let element"> {{element.getStatus()}} </td>
  </ng-container>

  <ng-container matColumnDef="labels">
        <th mat-header-cell *matHeaderCellDef> Labels </th>
        <td mat-cell *matCellDef="let element"> {{element.getLabelsList()}} </td>
  </ng-container>

  <ng-container matColumnDef="is-enrolled">
        <th mat-header-cell *matHeaderCellDef> Enrolled </th>
        <td mat-cell *matCellDef="let element"> {{element.getIsEnrolled()}} </td>
  </ng-container>

  <ng-container matColumnDef="unique-labels">
            <th mat-header-cell *matHeaderCellDef> Labels </th>
            <td mat-cell *matCellDef="let element"> </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
</div>
</mat-card>
</mat-tab>
<mat-tab label="Firmware">
<mat-card>
</mat-card>
</mat-tab>
</mat-tab-group>
</mat-card>
