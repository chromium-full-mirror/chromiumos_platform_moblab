<mat-card>
  <mat-tab-group [selectedIndex]="selectedTabIndex" (selectedTabChange)="tabChanged()">
    <mat-tab label="Enrollment">

      <mat-card>
        <button mat-raised-button color="primary" (click)="enrollSelected()">Enroll Selected</button>
        <button mat-raised-button (click)="unenrollSelected()">Unenroll Selected</button>
        <mat-checkbox  [checked]="filterLabels"
        (change)="toggleFilterLabels()"> Filter labels</mat-checkbox>
      </mat-card>

      <mat-card>
        <table mat-table [dataSource]="duts">

          <ng-container matColumnDef="select">
            <th width="10%" mat-header-cell *matHeaderCellDef>
              <mat-form-field>
              <mat-select [(ngModel)]="selectValue">
                <mat-option value="Select">Select...</mat-option>
                <mat-option value="None">None</mat-option>
                <mat-option value="All">All</mat-option>
                <mat-option value="UnEnrolled">UnEnrolled</mat-option>
                <mat-option value="Enrolled">Enrolled</mat-option>
              </mat-select>
              </mat-form-field>
            </th>
            <td mat-cell *matCellDef="let row">
              <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                [checked]="selection.isSelected(row)">
              </mat-checkbox>
            </td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th th width="10%" mat-header-cell *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let element"> {{element.getIp()}} </td>
          </ng-container>

          <ng-container matColumnDef="board">
            <th th width="10%" mat-header-cell *matHeaderCellDef> Board </th>
            <td mat-cell *matCellDef="let element"> {{element.getBoardsList()}} </td>
          </ng-container>

          <ng-container matColumnDef="model">
            <th th width="10%" mat-header-cell *matHeaderCellDef> Model </th>
            <td mat-cell *matCellDef="let element"> {{element.getModelsList()}} </td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th th width="10%" mat-header-cell *matHeaderCellDef> Status </th>
            <td mat-cell *matCellDef="let element"> {{element.getStatus()}} </td>
          </ng-container>

          <ng-container matColumnDef="labels">
            <th width="40%" mat-header-cell *matHeaderCellDef> Labels </th>
            <td mat-cell *matCellDef="let element"> {{element.getLabelsList() | labelListToString:labelFilterList }} </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </mat-card>
    </mat-tab>
    <mat-tab label="Firmware">
      <mat-card>
        <button mat-raised-button color="primary" (click)="updateFirmware()">Update Firmware</button>
      </mat-card>

      <mat-card>
        <table mat-table [dataSource]="firmware_duts">

          <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef>
              <mat-checkbox (change)="$event ? masterToggle() : null"
                [checked]="selection.hasValue() && isAllSelected()">
              </mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let row">
              <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                [checked]="selection.isSelected(row)">
              </mat-checkbox>
            </td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Name </th>
            <td mat-cell> </td>
          </ng-container>

          <ng-container matColumnDef="model">
            <th mat-header-cell *matHeaderCellDef> Model </th>
            <td > </td>
          </ng-container>

          <ng-container matColumnDef="currentfirmware">
            <th mat-header-cell *matHeaderCellDef> Current Firmware </th>
            <td > </td>
          </ng-container>

          <ng-container matColumnDef="updaterfirmware">
            <th mat-header-cell *matHeaderCellDef> Updater Firmware </th>
            <td mat-cell>  </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="firmwareDisplayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: firmwareDisplayedColumns;"></tr>
        </table>
      </mat-card>
    </mat-tab>
  </mat-tab-group>
</mat-card>
