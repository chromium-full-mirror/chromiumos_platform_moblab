<div id="duts-refresh-button-wrapper">
  <button
    id="duts-refresh-button"
    matTooltip="Refresh"
    mat-icon-button
    (click)="refreshConnectedDuts()">
    <mat-icon>refresh</mat-icon>
  </button>
</div>
<div>
<table mat-table id="view-duts-table" [dataSource]="duts" matSort>
  <ng-container matColumnDef="select">
    <th width="10%" mat-header-cell *matHeaderCellDef>
      <app-table-header-selector
        class="select-cb"
        [options]="selectOptions"
        (update)="selectionChanged($event)">
      </app-table-header-selector>
    </th>
    <td mat-cell *matCellDef="let row">
      <mat-checkbox
        class="select-cb"
        (click)="$event.stopPropagation()"
        (change)="$event ? selection.toggle(row) : null"
        [checked]="selection.isSelected(row)"
        [disabled]="!row.getIsConnected()">
      </mat-checkbox>
    </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th th width="10%" mat-header-cell mat-sort-header *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let element">{{element.getIp()}}</td>
  </ng-container>

  <ng-container matColumnDef="buildtarget">
    <th th width="10%" mat-header-cell mat-sort-header *matHeaderCellDef>
      Build Target
    </th>
    <td mat-cell *matCellDef="let element">{{element.getBuildTargetsList()}}</td>
  </ng-container>

  <ng-container matColumnDef="model">
    <th th width="10%" mat-header-cell mat-sort-header *matHeaderCellDef>Model</th>
    <td mat-cell *matCellDef="let element">{{element.getModelsList()}}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th th width="10%" mat-header-cell mat-sort-header *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let element">{{element.getStatus()}}</td>
  </ng-container>

  <ng-container matColumnDef="labels">
    <th width="40%" mat-header-cell *matHeaderCellDef>
      Labels
      <mat-checkbox
        class="filter-cb"
        [checked]="filterLabels"
        (change)="toggleFilterLabels()">
        Filter labels
      </mat-checkbox>
    </th>
    <td mat-cell *matCellDef="let element">
      <div *ngIf="!element.getError(); else elseBlock">
        {{element.getLabelsList() | labelListToString: labelFilterSet:filterLabels}}
      </div>
      <ng-template #elseBlock>{{element.getError()}} </ng-template>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"
      matTooltip="{{this.getDisabledReason(row)}}"
      [routerLink]="row.getIsConnected() ? ['/dut_detail', row.getIp()] : []"
      [attr.notConnected]="!row.getIsConnected()"
      [hidden]="this.hideUnenrolledDuts && !row.getIsEnrolled() "></tr>
</table>
  <div id="loading-overlay" *ngIf="loading">
    <div class="loading-spinner-wrapper">
      <mat-spinner class="spinner"></mat-spinner>
    </div>
  </div>
</div>
