<mat-card>
  <div fxLayout="row" fxLayoutAlign="start stretch" fxLayoutGap="25px">
    <div>
      <button mat-raised-button color="primary" (click)="enrollSelected()" [disabled]="!hasSelectedDuts()">
        Enroll Selected
      </button>
    </div>
    <div>
      <button mat-raised-button (click)="unenrollSelected()" [disabled]="!hasSelectedDuts()">
        Unenroll Selected
      </button>
    </div>
    <div>
      <button mat-raised-button (click)="reverifySelected()" [disabled]="!hasSelectedDuts()">
        Reverify Selected
      </button>
    </div>
    <mat-divider [vertical]="true"></mat-divider>
    <div>
      <button mat-raised-button (click)="provisionDuts()">
        Provision DUTs
      </button>
    </div>
  </div>
</mat-card>

<app-view-duts></app-view-duts>
