<mat-card>
  <div class="form-wrapper">
    <b class="edit-box-contents">Attribute:</b>
    <mat-form-field class="filter edit-box-contents key-form-field" floatLabel="never">
      <input id="attribute-key-input" matInput [formControl]="attribute_key" placeholder='key'>
      <mat-error *ngIf="this.attribute_key.hasError('leadingTrailingwhitespace')">
        Leading/trailing spaces will be trimmed on adding.
      </mat-error>
    </mat-form-field>
    <mat-form-field class="filter edit-box-contents value-form-field" floatLabel="never">
      <input id="attribute-value-input" matInput [formControl]="attribute_value" placeholder='value'>
      <mat-error *ngIf="this.attribute_value.hasError('leadingTrailingwhitespace')">
        Leading/trailing spaces will be trimmed on adding.
      </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" id="add-attribute-button" (click)="doEdit(addAttribute)"
      [disabled]="attribute_key.value === '' || attribute_value.value === ''" class="edit-box-contents">
      Add
    </button>
    <button mat-raised-button id="remove-attribute-button" (click)="doEdit(removeAttribute)"
      [disabled]="attribute_key.value === '' || attribute_value.value !== ''" class="edit-box-contents">
      Remove
    </button>
  </div>

  <div class="filter edit-box-contents form-wrapper">
    <b class="edit-box-contents"> Pool: </b>
    <mat-form-field class="edit-box-contents filter key-form-field" floatLabel="never">
      <input id="pool-input" matInput [formControl]="pool">
      <mat-error *ngIf="this.pool.hasError('leadingTrailingwhitespace')">
        Leading/trailing spaces will be trimmed on adding.
      </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" id="add-pool-button" (click)="doEdit(addPool)"
      [disabled]="pool.value === ''" class="edit-box-contents">
      Add
    </button>
    <button mat-raised-button id="remove-pool-button" (click)="doEdit(removePool)" [disabled]="pool.value === ''"
      class="edit-box-contents">
      Remove
    </button>
  </div>

  <div class="filter edit-box-contents form-wrapper">
    <b class="edit-box-contents"> Label: </b>
    <mat-form-field class="edit-box-contents filter key-form-field" floatLabel="never">
      <input id="label-input" matInput [formControl]="label">
      <mat-error *ngIf="this.label.hasError('leadingTrailingwhitespace')">
        Leading/trailing spaces will be trimmed on adding.
      </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" id="add-label-button" (click)="doEdit(addLabel)"
      [disabled]="label.value === ''" class="edit-box-contents">
      Add
    </button>
    <button mat-raised-button id="remove-label-button" (click)="doEdit(removeLabel)" [disabled]="label.value === ''"
      class="edit-box-contents">
      Remove
    </button>
  </div>
</mat-card>
<app-view-duts hideUnenrolledDuts=true></app-view-duts>
