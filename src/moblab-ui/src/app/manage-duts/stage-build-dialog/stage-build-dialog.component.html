<div class="loading-overlay-wrapper">
    <app-loading-overlay></app-loading-overlay>
</div>
<mat-card *ngIf="stageBuildNotification" class="notification-banner {{ stageBuildNotification.cssClass }}">
    <mat-icon class="notification-icon {{ stageBuildNotification.cssClass }}">{{ stageBuildNotification.icon }}
    </mat-icon>
    {{ stageBuildNotification.message }}
</mat-card>
<h2 mat-dialog-title>Access Test Build</h2>
<mat-dialog-content class="mat-typography">

    <app-basic-autocomplete-selector #modelSelector [title]="'Select model:'" [options]="models" [isShown]="true"
        (select)="modelChanged($event.value)">
    </app-basic-autocomplete-selector>

    <app-basic-autocomplete-selector #buildTargetSelector [title]="'Select build target:'" [options]="buildTargets"
        [isShown]="true" (select)="buildTargetChanged($event.value)">
    </app-basic-autocomplete-selector>

    <app-basic-autocomplete-selector #milestoneSelector [title]="'Select milestone:'" [options]="milestones"
        [isShown]="true" (select)="milestoneChanged($event.value)">
    </app-basic-autocomplete-selector>

    <app-basic-autocomplete-selector #buildSelector [title]="'Select build:'" [options]="buildVersions" [isShown]="true"
        (select)="buildVersionChanged($event.value)">
    </app-basic-autocomplete-selector>


</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button *ngIf="!isStageBuildSucceeded()" mat-button (click)="stageBuild()"
        [disabled]="this.stageBuildButtonDisabled">Start</button>
    <a href="{{buildBucketUrl}}" target="_blank" *ngIf="isStageBuildSucceeded()" [mat-dialog-close]="returnMessage"
        mat-button>Go to Build Bucket</a>
</mat-dialog-actions>
