<div fxLayout="column">
  <mat-toolbar fxFlex="100" color="primary" opened="true" #topToolbar>
    <div class="toolbar-button">
      <button mat-button (click)="mainSideNav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
    </div>
    <div fxLayout="row" fxLayoutAlign="start center" fxFlex="80">
      <div class="toolbar-icon" fxFlex="5">
        <mat-icon class="moblab-logo-icon" svgIcon="moblab"></mat-icon>
      </div>
      <div class="toolbar-title" fxFlex="8">
        Moblab
      </div>
    </div>
    <div>
      <div *ngIf="this.isPageInformationEnabled()" class="toolbar-item" fxFlex="40">
        Page Information Here
        <mat-icon class="problem-icon">report_problem</mat-icon>
      </div>

      <span id="links-box">
        <div class="link-box-item">
          <a style="color: white;" href="{{afe_link}}" target="_blank">Old UI</a>
        </div>
        |
        <div class="link-box-item">
          <a style="color: white;" href="{{mobmonitor_link}}" target="_blank">Mobmonitor</a>
        </div>
        |
        <div class="link-box-item feedback-icon-wrapper">
          <app-feedback></app-feedback>
        </div>
      </span>
    </div>
  </mat-toolbar>
  <mat-toolbar class="mat-toolbar-warn" *ngIf="this.pauseRequestors?.length">
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="10px">
      <span>Job Scheduler is paused due to:</span>
      <mat-chip-list>
        <mat-chip *ngFor="let message of getPausedDueToUser()" color="primary" selected="true"
          matTooltip="Resume job scheduler on Configurations page." matTooltipPosition="above">
          {{ message }}
        </mat-chip>
        <mat-chip *ngFor="let message of getPausedDueToLowDisk()" color="warn" selected="true"
          matTooltip="Free up disk space to resume job scheduler." matTooltipPosition="above">
          {{ message }}
        </mat-chip>
      </mat-chip-list>
    </div>
  </mat-toolbar>

  <mat-sidenav-container fxFlex="95" class="sidenav-container">
    <mat-sidenav #mainSideNav mode="side" opened="true">
      <mat-nav-list>
        <a *ngFor="let tab of navTabs" mat-list-item class="sidebar-items" routerLink="{{ tab.route }}"
          routerLinkActive="active-route" #routerLinkActiveInstance="routerLinkActive"
          [class.list-item-active]="routerLinkActiveInstance.isActive" [routerLinkActiveOptions]="{ exact: true }">
          <mat-icon class="moblab-sidebar-icon">{{ tab.icon }} </mat-icon>
          {{ tab.label }}
        </a>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content fxFlex="100">
      <mat-list>
        <mat-list-item *ngFor="let error of getErrors()">
          <mat-icon>report_problem</mat-icon>{{ error }}
          <button mat-raised-button color="primary">See More</button>
          <button mat-raised-button color="accent">Dismiss</button>
        </mat-list-item>
        <mat-list-item *ngFor="let message of getMessages()">
          <mat-icon>info</mat-icon>{{ message }}
          <button mat-raised-button color="primary">Dismiss</button>
        </mat-list-item>
      </mat-list>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
