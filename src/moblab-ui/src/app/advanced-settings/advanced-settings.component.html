<content md-content>

  <mat-card>
    <mat-card-header>
      <mat-card-title>Experimental Features</mat-card-title>
    </mat-card-header>
    <mat-card-subtitle>The following list of features are experimental.  Unless someone from Google requests please do not enable these features.
      <br><br>Google will not answer questions about these features until they are released for all users.</mat-card-subtitle>
      <mat-card-content><mat-checkbox class="example-margin" [(ngModel)]="faftEnabled" (ngModelChange)="saveFAFTSetting($event)">FAFT Tests</mat-checkbox></mat-card-content>
  </mat-card>
</content>
