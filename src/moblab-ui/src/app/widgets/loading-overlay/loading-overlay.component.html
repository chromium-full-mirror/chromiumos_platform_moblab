<div id="overlay" *ngIf="!hideOverlay"
     [class.center]="isCenterOverlay()"
     [class.top]="isTopOverlay()">
  <div class="loading-wrapper">
    <mat-card class="loading-card">
      <div id="loading-message">{{message}}</div>
    </mat-card>
    <mat-progress-bar class="loading-widget" mode="indeterminate"></mat-progress-bar>
  </div>
</div>
