<app-moblab-selector
  #boardSelector
  [title]="'Select build target:'"
  [placeholder]="['Pick from available targets']"
  [options]="buildTargets"
  [isShown]="buildTargetsPickerActive"
  (update)="buildTargetChanged($event.value)"
>
</app-moblab-selector>

<app-moblab-selector
  #milestoneSelector
  [title]="'Select milestone:'"
  [placeholder]="['Pick from available milestones']"
  [options]="milestones"
  [isShown]="milestonesPickerActive"
  (update)="milestoneChanged($event.value)"
>
</app-moblab-selector>

<app-moblab-selector
  #buildSelector
  [title]="'Select build:'"
  [placeholder]="['Pick from available builds']"
  [options]="buildVersions"
  [isShown]="buildVersionsPickerActive"
  (update)="buildVersionChanged($event.value)"
>
</app-moblab-selector>
