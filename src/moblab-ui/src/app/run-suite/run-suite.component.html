<div id="card-wrapper">
  <mat-card id="outer-card">
    <mat-tab-group>
      <mat-tab label="CTS">
        <ng-template matTabContent>
          <div class="suite-form-wrapper">
            <app-loading-overlay></app-loading-overlay>
            <app-cts-run
              (suiteStarted)="onSuiteStart()"
              (formLoadingStart)="onLoadingStart($event.message)"
              (formLoadingFinish)="onLoadingFinish()">
            </app-cts-run>
          </div>
        </ng-template>
      </mat-tab>
      <mat-tab label="GTS">
        <ng-template matTabContent>
          <div class="suite-form-wrapper">
            <app-loading-overlay></app-loading-overlay>
            <app-gts-run
              (suiteStarted)="onSuiteStart()"
              (formLoadingStart)="onLoadingStart($event.message)"
              (formLoadingFinish)="onLoadingFinish()">
            </app-gts-run>
          </div>
        </ng-template>
      </mat-tab>
      <mat-tab label="Memory Qualification">
        <ng-template matTabContent>
          <div class="suite-form-wrapper">
            <app-loading-overlay></app-loading-overlay>
            <app-memory-qual
              (suiteStarted)="onSuiteStart()"
              (formLoadingStart)="onLoadingStart($event.message)"
              (formLoadingFinish)="onLoadingFinish()">
            </app-memory-qual>
          </div>
        </ng-template>
      </mat-tab>
      <mat-tab label="Storage Qualification">
        <ng-template matTabContent>
          <div class="suite-form-wrapper">
            <app-loading-overlay></app-loading-overlay>
            <app-storage-qual
              (suiteStarted)="onSuiteStart()"
              (formLoadingStart)="onLoadingStart($event.message)"
              (formLoadingFinish)="onLoadingFinish()">
            </app-storage-qual>
          </div>
        </ng-template>
      </mat-tab>
      <mat-tab label="Other">
        <ng-template matTabContent>
          <div class="suite-form-wrapper">
            <app-loading-overlay></app-loading-overlay>
            <app-run-any-suite
              (suiteStarted)="onSuiteStart()"
              (formLoadingStart)="onLoadingStart($event.message)"
              (formLoadingFinish)="onLoadingFinish()">
            </app-run-any-suite>
          </div>
        </ng-template>
      </mat-tab>
    </mat-tab-group>
  </mat-card>
</div>
