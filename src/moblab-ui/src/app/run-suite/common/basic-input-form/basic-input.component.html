<div class="text-base mb-4 w-full" matTooltip="{{ this.getDisabledReason() }}">
  <mat-form-field>
    <mat-label>{{ name }}</mat-label>
    <input
      id="input"
      matInput
      [formControl]="this.getInputFormControl()"
      [disabled]="true"
    />
    <mat-error *ngIf="this.getInputFormControl().hasError('isNaN')">
      Input needs to be numeric.
    </mat-error>
  </mat-form-field>
</div>
