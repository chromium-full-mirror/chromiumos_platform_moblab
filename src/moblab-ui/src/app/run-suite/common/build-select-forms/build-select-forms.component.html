<app-basic-selector
    #modelSelector
    id="modelSelector"
    [title]="'Select model:'"
    [placeholder]="['Pick from available model']"
    [options]="models"
    [isShown]="true"
    (update)="modelChanged($event.value)">
</app-basic-selector>

<app-basic-selector
    #boardSelector
    id="boardSelector"
    [title]="'Select build target:'"
    [placeholder]="['Pick from available targets']"
    [options]="buildTargets"
    [isShown]="true"
    (update)="buildTargetChanged($event.value)">
</app-basic-selector>

<app-basic-selector
    #buildSelector
    id="buildSelector"
    [title]="'Select build:'"
    [placeholder]="['Pick from available builds']"
    [options]="buildVersions"
    [isShown]="true"
    (update)="buildVersionChanged($event.value)">
</app-basic-selector>

<app-basic-selector
    #poolSelector
    id="poolSelector"
    [title]="'Pool (Optional):'"
    [placeholder]="['Select a pool']"
    [options]="pools"
    [isShown]="true"
    [autoselect]="false"
    (update)="poolChanged($event.value)">
</app-basic-selector>
