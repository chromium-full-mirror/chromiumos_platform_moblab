<mat-card>
  <app-build-select-forms (allRequiredFieldsSet)="onBuildSet($event)" (formLoading)="onFormLoading($event.message)"
    (formLoaded)="onFormLoaded()" (buildVersionUnselected)="onBuildVersionUnselected()">
  </app-build-select-forms>
  <app-basic-selector #suiteSelector [title]="'Select CUJ suite:'" [options]="suiteList"
    [placeholder]="['Select a suite']" [isShown]="true" (select)="suiteDropdownChanged($event.value)">
  </app-basic-selector>
  <div [hidden]="!hideCustomInput">
    <br>
  </div>
  <app-basic-input [hidden]="hideCustomInput" #suiteInput [name]="'Custom Suite Name'" (update)="suiteChanged()">
  </app-basic-input>

  <div class="basic-radio-button" style="text-align: center;">
    <mat-radio-group #labelSelector [disabled]="labelSelectDisabled" (change)="suiteLabelChanged($event.value)">
      <mat-radio-button value="basic">Basic</mat-radio-button>
      <mat-radio-button value="plus">Plus</mat-radio-button>
      <mat-radio-button value="premium">Premium</mat-radio-button>
    </mat-radio-group>
  </div>

  <app-basic-checkbox #externalDisplayToggle [name]="'Include external display tests'">
  </app-basic-checkbox>

  <app-new-update-notifier></app-new-update-notifier>
  
  <app-run-suite-button (onClick)="onRunSuiteClick()"></app-run-suite-button>
</mat-card>
