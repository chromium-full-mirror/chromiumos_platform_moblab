<mat-card style="padding-top:35px;">
  <app-build-select-forms (allRequiredFieldsSet)="onBuildSet($event)"
    (buildVersionUnselected)="onBuildVersionUnselected()" (formLoading)="onFormLoading($event.message)"
    (formLoaded)="onFormLoaded()">
  </app-build-select-forms>

  <app-basic-selector #dutSelector [title]="'Select Chromebook(DUT) IP Address:'" [options]="dutIPs"
    [placeholder]="['Select an IP']" [isShown]="true" (select)="dutIPDropdownChanged($event.value)">
  </app-basic-selector>

  <app-basic-selector #suiteSelector [title]="'Select suite:'" [options]="suiteList" [placeholder]="['Select a suite']"
    [isShown]="true" (select)="suiteDropdownChanged($event.value)">
  </app-basic-selector>

  <app-basic-selector #deviceIdSelector [title]="'Select a device id'" [options]="data"
    [placeholder]="['Select a device']" [isShown]="suiteSelected" (select)="deviceIdChanged($event)">
  </app-basic-selector>

  <app-basic-input #deviceInput [hidden]="(suiteName !== FWUPD_INSTALL_VERSION && suiteName !== FWUPD_INSTALL_FILE)" [name]="suiteName === FWUPD_INSTALL_FILE ? 'File' : 'Version'" (update)="deviceInputChanged()">
  </app-basic-input>


  <app-new-update-notifier></app-new-update-notifier>

  <mat-divider></mat-divider>
  <div *ngIf="device !== null" style="width: 310px">
    <div>
      <h4>Device Info:</h4>
    </div>
    <ul style="padding-inline-start: 1rem;">
      <li><strong>DeviceId:</strong> {{ device.DeviceId }}</li>
      <li><strong>Name:</strong> {{ device.Name }}</li>
      <li><strong>Vendor:</strong> {{ device.Vendor }}</li>
      <li><strong>Current FW version:</strong> {{ device.Version }}</li>
      <li><strong>Current bootloader FW version:</strong> {{ device.VersionBootloader }}</li>
      <li><strong>Guid:</strong> {{ device.Guid[0] }}</li>
      <li><strong>Flags:</strong> {{ device.Flags.join(', ') }}</li>
    </ul>
    <mat-divider></mat-divider>
    <br />
  </div>

  <app-run-suite-button (onClick)="onRunSuiteClick()"></app-run-suite-button>
</mat-card>
