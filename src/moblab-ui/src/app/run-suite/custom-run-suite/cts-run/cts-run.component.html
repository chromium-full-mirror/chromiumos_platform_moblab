<mat-card>
  <app-build-select-forms (allRequiredFieldsSet)="onBuildSet($event)"></app-build-select-forms>

  <app-basic-selector
      #versionSelector
      [title]="'Select CTS version:'"
      [placeholder]="['Pick from CTS versions']"
      [options]="['cts_N', 'cts_P' ]"
      [isShown]="true"
      (update)="androidVersionChanged($event.value)">
  </app-basic-selector>

  <app-basic-text-form></app-basic-text-form>

  <app-run-suite-button (click)="onRunSuite()"></app-run-suite-button>
</mat-card>
