syntax = "proto3";

package moblab;

service MoblabRpcService {
  // Run a test suite
  rpc run_suite (RunSuiteRequest) returns (RunSuiteResponse) {}
  rpc run_cts_suite (RunCtsSuiteRequest) returns (RunCtsSuiteResponse) {}

  rpc list_connected_duts (ListConnectedDutsRequest) returns (ListConnectedDutsResponse) {}
  rpc list_build_targets (ListBuildTargetsRequest) returns (ListBuildTargetsResponse) {}
  rpc list_milestones (ListMilestonesRequest) returns (ListMilestonesResponse) {}
  rpc list_build_versions (ListBuildVersionsRequest) returns (ListBuildVersionsResponse) {}
  rpc list_models (ListModelsRequest) returns (ListModelsResponse) {}
  rpc list_pools (ListPoolsRequest) returns (ListPoolsResponse) {}

  rpc enroll_duts (EnrollDutsRequest) returns (EnrollDutsResponse) {}
  rpc unenroll_duts (EnrollDutsRequest) returns (EnrollDutsResponse) {}

  rpc list_connected_duts_firmware(ListConnectedDutsFirmwareRequest) returns (ListConnectedDutsFirmwareResponse) {}
  rpc update_duts_firmware(UpdateDutsFirmwareRequest) returns (UpdateDutsFirmwareResponse) {}

  rpc get_num_jobs(GetNumJobsRequest) returns (GetNumJobsResponse)  {}
  rpc get_jobs(GetJobsRequest) returns (GetJobsResponse)  {}
  rpc get_job_details(GetJobDetailsRequest) returns (GetJobDetailsResponse)  {}

  rpc get_dut_details(GetDutDetailsRequest) returns (GetDutDetailsResponse)  {}
  rpc get_num_dut_tasks(GetNumDutTasksRequest) returns (GetNumDutTasksResponse) {}
  rpc get_dut_tasks(GetDutTasksRequest) returns (GetDutTasksResponse) {}
}

// NEXT_TAG = 2
message RunSuiteRequest {
  string name = 1;
}

// NEXT_TAG = 2
message RunSuiteResponse {
  string message = 1;
}

// NEXT_TAG = 8
message RunCtsSuiteRequest {
  string suite = 1;
  string build_target = 2;
  string build_version = 3;
  string model = 4;
  string pool = 5;
  repeated string autotest_tests = 6;
  repeated string tradefed_tests = 7;
}

// NEXT_TAG = 2
message RunCtsSuiteResponse {
  string message = 1;
}

// NEXT_TAG = 16
message ConnectedDutInfo {
  string name = 1;
  string ip = 2;
  string mac_addr = 3;
  string status = 4;
  repeated string build_targets = 5;
  repeated string models  = 6;
  bool is_enrolled = 7;
  bool is_locked = 8;
  string lock_reason = 9;
  repeated string labels = 10;
  repeated string attributes= 11;
  repeated string pools= 12;
  string error = 13;
  int32 current_job = 14;
  // e.g., repairs, reverifies
  string current_dut_task = 15;
}
message ListConnectedDutsRequest {
}

// NEXT_TAG = 2
message ListConnectedDutsResponse {
  repeated ConnectedDutInfo duts = 1;
}

message ListBuildTargetsRequest {
}

// NEXT_TAG = 2
message ListBuildTargetsResponse {
  repeated string build_targets = 1;
}

// NEXT_TAG = 2
message ListMilestonesRequest {
  string build_target = 1;
}

// NEXT_TAG = 2
message ListMilestonesResponse {
  repeated string milestones = 1;
}

// NEXT_TAG = 3
message ListBuildVersionsRequest {
  string build_target = 1;
  string milestone = 2;
}

// NEXT_TAG = 2
message ListBuildVersionsResponse {
  repeated string build_versions = 1;
}

message ListModelsRequest {
}

// NEXT_TAG = 2
message ListModelsResponse {
  repeated string models = 1;
}

message ListPoolsRequest {
}

// NEXT_TAG = 2
message ListPoolsResponse {
  repeated string pools = 1;
}

// NEXT_TAG = 2
message EnrollDutsRequest {
  repeated string ips = 1;
}

message EnrollDutsResponse {
}

// NEXT_TAG = 2
message GetDutDetailsRequest {
  string dut = 1;
}

// NEXT_TAG = 2
message GetDutDetailsResponse {
  ConnectedDutInfo dut_detail = 1;
}

message ListConnectedDutsFirmwareRequest {
}

// NEXT_TAG = 4
message ConnectedDutFirmwareInfo {
  string ip = 1;
  string current_firmware = 2;
  string update_firmware = 3;
}

// NEXT_TAG = 2
message ListConnectedDutsFirmwareResponse {
  repeated ConnectedDutFirmwareInfo duts = 1;
}

// NEXT_TAG = 2
message UpdateDutsFirmwareRequest {
  repeated string ips = 1;
}

message UpdateDutsFirmwareResponse {
}

// NEXT_TAG = 9
message Execution {
  string name = 1;
  int32 job_id = 2;
  int64 start_time_utc = 3;
  int64 end_time_utc = 4;
  int64 used_time = 5;
  Job.JobStatus status = 6;
  string dut = 7;
  string dut_status = 8;
}

// NEXT_TAG = 16
message Job {
  // NEXT_TAG = 90
  enum Priority {
    PRIORITY_NOT_SET = 0;
    WEEKLY = 10;
    DAILY = 20;
    POST_BUILD = 30;
    DEFAULT = 40;
    BUILD = 50;
    PFQ = 60;
    CQ = 70;
    SUPER = 80;
  }

  // NEXT_TAG = 3
  enum Relationship {
    RELATIONSHIP_NOT_SET = 0;
    SUITE = 1;
    CHILD = 2;
  }

  // NEXT_TAG = 9
  enum JobStatus {
    STATUS_NOT_SET = 0;
    CREATED = 1;
    QUEUED = 2;
    PROVISIONING = 3;
    RUNNING = 4;
    SUCCESS = 5;
    FAILED = 6;
    TIMED_OUT = 7;
    ABORTED = 8;
  }

  // NEXT_TAG = 4
  enum QueueStatus {
    QUEUE_STATUS_NOT_SET = 0;
    QUEUED_JOBS = 1;
    JOBS_RUNNING = 2;
    FINISHED_JOBS = 3;
  }

  int32 job_id = 1;
  string name = 2;
  Priority priority = 3;
  int64 created_time_sec_utc = 4;
  int64 start_time_sec_utc = 5;
  int64 finished_time_sec_utc = 6;
  JobStatus status = 7;
  int32 parent_job_id = 8;

  // Parameters below are meant to only be defined in job details page.
  string dependencies = 9;
  string server_control_file = 10;
  int64 timeout = 11;
  int64 max_runtime = 12;
  int32 test_retries = 13;
  repeated Execution execution_history = 14;
  repeated Execution associated_duts = 15;
}

// NEXT_TAG = 10
message GetNumJobsRequest {
  string id_filter = 3;
  string name_filter = 4;
  // Timestamp int's are in second granularity.
  int64 created_time_lt = 5;
  int64 created_time_gt = 6;
  Job.QueueStatus status_filter = 7;
  // Relationship denotes whether a job is a parent/suite or child.
  Job.Relationship rel_filter = 8;
  string parent_id_filter = 9;
}

// NEXT_TAG = 2
message GetNumJobsResponse {
  int32 num_jobs = 1;
}

// NEXT_TAG = 10
message GetJobsRequest {
  int32 query_start = 1;
  int32 query_limit = 2;
  string id_filter = 3;
  string name_filter = 4;
  // Timestamp int's are in second granularity.
  int64 created_time_lt = 5;
  int64 created_time_gt = 6;
  Job.QueueStatus status_filter = 7;
  // Relationship denotes whether a job is a parent/suite or child.
  Job.Relationship rel_filter = 8;
  string parent_id_filter = 9;
}

// NEXT_TAG = 2
message GetJobsResponse {
  repeated Job jobs = 1;
}

// NEXT_TAG = 2
message GetJobDetailsRequest {
  string id = 1;
}

// NEXT_TAG = 2
message GetJobDetailsResponse {
  Job job_detail = 1;
}

// NEXT_TAG = 4
message GetNumDutTasksRequest {
  string ip = 1;
  int64 start_time_gt = 2;
  int64 end_time_lt = 3;
}

// NEXT_TAG = 2
message GetNumDutTasksResponse {
  int32 num_dut_tasks = 1;
}

// NEXT_TAG = 6
message GetDutTasksRequest {
  string ip = 1;
  int64 query_start = 2;
  int32 query_limit = 3;
  int64 start_time_gt = 4;
  int64 end_time_lt = 5;
}

// NEXT_TAG = 7
message DutTask {
  // NEXT_TAG = 6
  enum Status {
    STATUS_NOT_SET = 0;
    REQUESTED = 1;
    STARTED = 2;
    SUCCEEDED = 3;
    FAILED = 4;
    ABORTED = 5;
  }

  int32 id = 1;
  string task = 2;
  Status status = 3;
  int64 created_time_utc = 4;
  int64 started_time_utc = 5;
  int64 finished_time_utc = 6;
}

// NEXT_TAG = 2
message GetDutTasksResponse {
  repeated DutTask tasks = 1;
}
