substitutions:
  _REGISTRY_URI: gcr.io/chromeos-partner-moblab
  _LABEL: autopush
  _WATCHTOWER_CMD: "--interval 1"
  _SSH_PORT: "22"

steps:
  - id: buster-slim
    name: "docker:19.03.8"
    args: ["pull", "debian:buster-slim"]
    waitFor: ['-']
  - id: alpine-git
    name: "docker:19.03.8"
    args: ["pull", "alpine/git"]
    waitFor: ['-']
  - id: dockerfile-copy
    name: "docker:19.03.8"
    args: ["pull", "docker/dockerfile-copy:v0.1.9"]
    waitFor: ['-']
  - id: buster
    name: "docker:19.03.8"
    args: ["pull", "debian:buster"]
    waitFor: ['-']
  - id: python-2.7-slim
    name: "docker:19.03.8"
    args: ["pull", "python:2.7-slim-buster"]
    waitFor: ['-']
  - id: mariadb
    name: "docker:19.03.8"
    args: ["pull", "mariadb:10.2"]
    waitFor: ['-']
  - id: python-3.8-slim
    name: "docker:19.03.8"
    args: ["pull", "python:3.8-slim-buster"]
    waitFor: ['-']
  - id: python-3.8
    name: "docker:19.03.8"
    args: ["pull", "python:3.8-buster"]
    waitFor: ['-']
  - id: envoyproxy
    name: "docker:19.03.8"
    args: ["pull", "envoyproxy/envoy:v1.14.1"]
    waitFor: ['-']
  - id: openssh-server
    name: "docker:19.03.8"
    args: ["pull", "linuxserver/openssh-server"]
    waitFor: ['-']
  - id: watchtower
    name: "docker:19.03.8"
    args: ["pull", "v2tec/watchtower:latest"]
    waitFor: ['-']
  - id: docker-compose
    name: "docker:19.03.8"
    args: ["pull", "docker/compose:alpine-1.25.4"]
    waitFor: ['-']
  - id: node-buster
    name: "docker:19.03.8"
    args: ["pull", "node:12-buster"]
    waitFor: ['-']
  - id: node
    name: "docker:19.03.8"
    args: ["pull", "node:12"]
    waitFor: ['-']
  - id: alpine-edge
    name: "docker:19.03.8"
    args: ["pull", "alpine:edge"]
    waitFor: ['-']
  - id: nginx-alpine
    name: "docker:19.03.8"
    args: ["pull", "nginx:alpine"]
    waitFor: ['-']

  - id: protoc
    name: "docker:19.03.8"
    args:
      [
        "build",
        "-f",
        "/workspace/src/dockerfiles/utilities/Dockerfile.protoc",
        "-t",
        "${_REGISTRY_URI}/protoc:${_LABEL}",
        "/workspace/src/dockerfiles/utilities/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "buster-slim"

  - id: autotest-lucifer
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.lucifer",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-lucifer:${_LABEL}",
        "/workspace/src/dockerfiles/autotest/",
      ]
    waitFor:
      - "protoc"
      - "alpine-git"
      - "buster-slim"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: gwt-compiler
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/utilities/Dockerfile.gwtcompiler",
        "-t",
        "${_REGISTRY_URI}/gwtcompiler:${_LABEL}",
        "/workspace/src/dockerfiles/utilities",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "buster"

  - id: autotest-gwt
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.gwt",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-gwt:${_LABEL}",
        "/workspace/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "buster-slim"
      - "gwt-compiler"

  - id: autotest-base
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.base",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-base:${_LABEL}",
        "/workspace/",
      ]
    waitFor:
      - "protoc"
      - "alpine-git"
      - "buster-slim"
      - "python-2.7-slim"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-afe
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.afe",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-afe:${_LABEL}",
        "/workspace/src/dockerfiles/autotest",
      ]
    waitFor:
      - "autotest-base"
      - "autotest-gwt"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-dbsetup
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.dbsetup",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-dbsetup:${_LABEL}",
        "/workspace/src/dockerfiles/autotest",
      ]
    waitFor:
      - "autotest-base"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-monitor
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.monitor_db",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-monitor_db:${_LABEL}",
        "/workspace/src/dockerfiles/autotest",
      ]
    waitFor:
      - "autotest-base"
      - "autotest-lucifer"
      - "alpine-git"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-host
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.hostscheduler",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-host:${_LABEL}",
        "/workspace/src/dockerfiles/autotest",
      ]
    waitFor:
      - "autotest-base"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-abort
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.job_aborter",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-aborter:${_LABEL}",
        "/workspace/src/dockerfiles/autotest",
      ]
    waitFor:
      - "autotest-base"
      - "alpine-git"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: db
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/db/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-db:${_LABEL}",
        "/workspace/src/dockerfiles/db",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "mariadb"

  - id: db-init
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/db/Dockerfile.db_init",
        "-t",
        "${_REGISTRY_URI}/moblab-db-init:${_LABEL}",
        "/workspace/src/dockerfiles/db",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "buster-slim"

  - id: devserver
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/devserver/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/devserver:${_LABEL}",
        "/workspace/src/dockerfiles/devserver",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "alpine-git"
      - "buster-slim"

  - id: ui
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/ui/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-ui:${_LABEL}",
        "/workspace/src/",
      ]
    waitFor:
      - "protoc"
      - "node"
      - "nginx-alpine"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: ssp
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/ssp/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-ssp:${_LABEL}",
        "/workspace/src/dockerfiles/ssp",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "buster-slim"
      - "apline-git"

  - id: offloader
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/offloader/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-offloader:${_LABEL}",
        "/workspace/",
      ]
    waitFor:
      - "protoc"
      - "python-3.8"
      - "python-3.8-slim"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: envoy
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/envoy/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/envoy-proxy:${_LABEL}",
        "/workspace/src/dockerfiles/envoy",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "envoyproxy"

  - id: remote-agent
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/remote_agent/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-remote-agent:${_LABEL}",
        "/workspace/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "protoc"
      - "python-3.8"
      - "python-3.8-slim"

  - id: remote-scheduler
    name: "docker:19.03.8"
    args:
      [
        "build",

        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/remote-scheduler/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-remote-scheduler:${_LABEL}",
        "/workspace/",
      ]
    waitFor:
      - "protoc"
      - "python-3.8"
      - "python-3.8-slim"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: rpcserver
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/rpcserver/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-rpcserver:${_LABEL}",
        "/workspace/",
      ]
    waitFor:
      - "protoc"
      - "python-3.8"
      - "python-3.8-slim"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: compose
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "--build-arg",
        "SSH_PORT=${_SSH_PORT}",
        "-f",
        "/workspace/src/dockerfiles/compose/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-compose:${_LABEL}",
        "/workspace/src/dockerfiles/compose",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
      - "WATCHTOWER_CMD=${_WATCHTOWER_CMD}"
    waitFor:
      - "docker-compose"

  - id: local-dev-environment
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/local-dev-environment/Dockerfile.base",
        "-t",
        "${_REGISTRY_URI}/moblab-dev-environment:${_LABEL}",
        "/workspace/src/dockerfiles/local-dev-environment",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "node-buster"
      - "protoc"

  - id: mobmonitor
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/mobmonitor/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/mobmonitor:${_LABEL}",
        "/workspace/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "node"
      - "buster-slim"

  - id: dns
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/dns/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-dns:${_LABEL}",
        "/workspace/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - "alpine-edge"

  - id: remote_access
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/remote_access/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/remote_access:${_LABEL}",
        "/workspace/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"
    waitFor:
      - 'dockerfile-copy'
      - 'openssh-server'
      - 'autotest-base'


images:
  [
    "${_REGISTRY_URI}/protoc:${_LABEL}",
    "${_REGISTRY_URI}/moblab-autotest-lucifer:${_LABEL}",
    "${_REGISTRY_URI}/moblab-autotest-gwt:${_LABEL}",
    "${_REGISTRY_URI}/moblab-autotest-base:${_LABEL}",
    "${_REGISTRY_URI}/moblab-autotest-dbsetup:${_LABEL}",
    "${_REGISTRY_URI}/moblab-autotest-monitor_db:${_LABEL}",
    "${_REGISTRY_URI}/moblab-autotest-host:${_LABEL}",
    "${_REGISTRY_URI}/moblab-autotest-aborter:${_LABEL}",
    "${_REGISTRY_URI}/moblab-compose:${_LABEL}",
    "${_REGISTRY_URI}/moblab-rpcserver:${_LABEL}",
    "${_REGISTRY_URI}/moblab-remote-scheduler:${_LABEL}",
    "${_REGISTRY_URI}/moblab-remote-agent:${_LABEL}",
    "${_REGISTRY_URI}/remote_access:${_LABEL}",
    "${_REGISTRY_URI}/envoy-proxy:${_LABEL}",
    "${_REGISTRY_URI}/moblab-offloader:${_LABEL}",
    "${_REGISTRY_URI}/moblab-ui:${_LABEL}",
    "${_REGISTRY_URI}/devserver:${_LABEL}",
    "${_REGISTRY_URI}/moblab-db-init:${_LABEL}",
    "${_REGISTRY_URI}/moblab-db:${_LABEL}",
    "${_REGISTRY_URI}/moblab-autotest-afe:${_LABEL}",
    "${_REGISTRY_URI}/moblab-ssp:${_LABEL}",
    "${_REGISTRY_URI}/moblab-dev-environment:${_LABEL}",
    "${_REGISTRY_URI}/mobmonitor:${_LABEL}",
    "${_REGISTRY_URI}/gwtcompiler:${_LABEL}",
    "${_REGISTRY_URI}/moblab-dns:${_LABEL}",
  ]

options:
  # Use higher CPU machines so the caching and build steps are faster.
  machineType: "N1_HIGHCPU_32"
  substitution_option: "ALLOW_LOOSE"

timeout: 18000s
