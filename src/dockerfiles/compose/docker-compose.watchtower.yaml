version: "3"
services:

  watchtower:
    container_name: watchtower
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/watchtower:${WATCHTOWER:-release}
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    command: ${WATCHTOWER_CMD}

    ulimits:
      nofile:
        soft: 10000
        hard: 16384
