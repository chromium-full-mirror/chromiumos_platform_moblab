version: '3'
services:
  db:
    image: gcr.io/chromeos-partner-moblab/moblab-db:release
    hostname: db
    user: moblab

    volumes:
    - logs:/var/log/moblab
    - db_data:/var/lib/mysql

    networks:
      moblab:
        aliases:
          - db

    environment:
    - MYSQL_ROOT_PASSWORD=moblab_db_passwd

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pmoblab_db_passwd", "--silent"]
      interval: 1m30s
      timeout: 10s
      retries: 3
    ulimits:
      nofile:
        soft: 10000
        hard: 16384

  db-init:
    image: gcr.io/chromeos-partner-moblab/moblab-db-init:release
    user: moblab
    depends_on:
      - db
    networks:
      moblab:

  devserver:
    image: gcr.io/chromeos-partner-moblab/devserver:release
    hostname: devserver
    user: moblab
    depends_on:
      - autotest

    volumes:
    - logs:/var/log/moblab
    - moblab_home:/home/moblab
    - usr_local_moblab:/usr/local/moblab
    - static_cache:/static

    networks:
      moblab:
        ipv4_address: 192.168.100.50
        aliases:
          - database
    ulimits:
      nofile:
        soft: 10000
        hard: 16384

  autotest:
    image: gcr.io/chromeos-partner-moblab/moblab-autotest:release
    hostname: autotest
    user: moblab
    ports:
    - 80:8888

    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:rw
    - logs:/var/log/moblab
    - usr_local_moblab:/usr/local/moblab
    - results:/usr/local/autotest/results
    - results:/results
    - moblab_home:/home/moblab
    - containers:/moblab/third_party/autotest/containers
    - apache_logs:/var/log/apache2
    - leases:/leases:ro
    - /etc/lsb-release:/etc/lsb-release:ro

    environment:
    - CROS_VENV_CACHE=/usr/local/.cros-venv-cache
    - LABEL=$LABEL

    networks:
    - moblab

    depends_on:
      - db
      - db-init

    cap_add:
      - CAP_NET_BIND_SERVICE
      - CAP_NET_RAW
      - ALL

    ulimits:
      nofile:
        soft: 10000
        hard: 16384

    extra_hosts:
      - "dockerhost:192.168.100.1"

  envoy-proxy:
    image: gcr.io/chromeos-partner-moblab/envoy-proxy:release
    user: moblab
    hostname: envoy-proxy
    volumes:
    - logs:/var/log/moblab

    networks:
    - moblab

    ports:
    - 6001:6001
    - 6011:6011

  moblab-ui:
    image: gcr.io/chromeos-partner-moblab/moblab-ui:release
    hostname: moblab-ui

    networks:
    - moblab

    ports:
    - 6010:6010

  moblab-rpcserver:
    image: gcr.io/chromeos-partner-moblab/moblab-rpcserver:release
    user: moblab
    hostname: moblab-rpcserver

    volumes:
    - logs:/var/log/moblab
    - moblab_home:/home/moblab

    networks:
    - moblab

    depends_on:
    - autotest

    extra_hosts:
      - "dockerhost:192.168.100.1"

  watchtower:
    image: gcr.io/chromeos-partner-moblab/watchtower:release

    volumes:
    - /var/run/docker.sock:/var/run/docker.sock

    command: --interval 60

    networks:
    - moblab

    ulimits:
      nofile:
        soft: 10000
        hard: 16384

  offloader:
    image: gcr.io/chromeos-partner-moblab/moblab-offloader:release
    deploy:
     restart_policy:
        delay: 120s
        window: 20s

    user: moblab

    volumes:
      - results:/usr/local/autotest/results
      - moblab_home:/home/moblab
      - logs:/var/log/moblab

    networks:
      - moblab

    command: >
             -l /var/log/moblab/offloader.log
             run
             --gs-bucket chromeos-moblab-peng-staging
             --credentials-file /home/moblab/.service_account.json
             --min-age-to-prune 1
             --jobs 100

    depends_on:
    - autotest

    environment:
    - GOOGLE_APPLICATION_CREDENTIALS=/home/moblab/.service_account.json

    ulimits:
      nofile:
        soft: 10000
        hard: 16384

    extra_hosts:
      - "dockerhost:192.168.100.1"

  monitoring:
    image: google/cadvisor:latest

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

    ports:
      - 9997:8080

    networks:
      - moblab

  log-rotate:
    image: blacklabelops/logrotate:latest

    volumes:
      - /var/log/bootup:/bootup
      - logs:/logs

    environment:
      - LOGS_DIRECTORIES=/bootup /var/log/docker /logs
      - LOGROTATE_INTERVAL=hourly

    networks:
      - moblab

  remote_access:
    image: gcr.io/chromeos-partner-moblab/remote_access:release

    volumes:
      - logs:/var/log/moblab
      - usr_local_moblab:/usr/local/moblab
      - static_cache:/mnt/moblab/cache
      - results:/mnt/moblab/results
      - containers:/mnt/moblab/containers
      - apache_logs:/var/log/apache
      - /var/log/bootup:/var/log/bootup
      - moblab_home:/home/moblab

    environment:
      - PUBLIC_KEY_FILE=/testing_rsa.pub
      - PUID=246
      - PGID=246
      - TZ=Etc/UTC
      - USER_NAME=moblab
      - DOCKER_MODS=linuxserver/mods:openssh-server-ssh-tunnel

    ports:
      - 2222:2222

    networks:
      - moblab


volumes:
  db_data: {}
  logs: {}
  moblab_home: {}
  usr_local_moblab: {}
  static_cache: {}
  results: {}
  containers: {}
  apache_logs: {}
  leases:
    external: True

networks:
  moblab:
    ipam:
      driver: default
      config:
        - subnet: "192.168.100.0/24"
