version: "3"
services:
  ##############################################################################
  db:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-db:${LABEL:-release}
    hostname: db
    restart: on-failure
    user: moblab

    volumes:
      - logs:/var/log/moblab
      - db_data:/var/lib/mysql

    networks:
      moblab:
        aliases:
          - db

    environment:
      - MYSQL_ROOT_PASSWORD=moblab_db_passwd

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-uroot",
          "-pmoblab_db_passwd",
          "--silent",
        ]
      interval: 1m30s
      timeout: 10s
      retries: 3

    ulimits:
      nofile:
        soft: 10000
        hard: 16384
  ##############################################################################
  db-init:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-db-init:${LABEL:-release}
    user: moblab
    depends_on:
      - db

    networks:
      moblab:
  ##############################################################################
  devserver:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/devserver:${LABEL:-release}
    hostname: devserver
    restart: on-failure
    user: moblab
    depends_on:
      - autotest

    volumes:
      - logs:/var/log/moblab
      - moblab_home:/home/moblab
      - usr_local_moblab:/usr/local/moblab
      - static_cache:/static

    networks:
      moblab:
        ipv4_address: 192.168.100.50
        aliases:
          - database
    ulimits:
      nofile:
        soft: 10000
        hard: 16384
  ##############################################################################
  autotest:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-autotest-afe:${LABEL:-release}
    hostname: autotest
    restart: on-failure
    user: moblab
    ports:
      - 80:8888

    volumes:
      - logs:/var/log/moblab
      - usr_local_moblab:/usr/local/moblab
      - results:/usr/local/autotest/results
      - results:/results
      - moblab_home:/home/moblab
      - apache_logs:/var/log/apache2
      - leases:/leases:ro
      - /etc/lsb-release:/etc/lsb-release:ro
      - shadowconfig:/shadow_config

    environment:
      - LABEL=$LABEL

    networks:
      - moblab

    depends_on:
      - autotest-dbsetup

    cap_add:
      - CAP_NET_BIND_SERVICE
      - CAP_NET_RAW
      - ALL

    ulimits:
      nofile:
        soft: 10000
        hard: 16384

    extra_hosts:
      - "dockerhost:192.168.100.1"

  autotest-dbsetup:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-autotest-dbsetup:${LABEL:-release}
    user: moblab
    volumes:
      - logs:/var/log/moblab
      - logs:/usr/local/autotest/logs
      - /etc/lsb-release:/etc/lsb-release:ro

    networks:
      - moblab

    depends_on:
      - db-init

  autotest-monitordb:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-autotest-monitor_db:${LABEL:-release}
    user: moblab
    restart: on-failure

    volumes:
      - logs:/var/log/moblab
      - logs:/moblab/third_party/autotest/logs
      - /etc/lsb-release:/etc/lsb-release:ro
      - results:/usr/local/autotest/results
      - lucifer_leases:/usr/local/autotest/leases
      - shadowconfig:/shadow_config
      - moblab_home:/home/moblab
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - containers:/moblab/third_party/autotest/containers

    networks:
      - moblab

    depends_on:
      - autotest

    cap_add:
      - CAP_NET_BIND_SERVICE
      - CAP_NET_RAW
      - ALL

    ulimits:
      nofile:
        soft: 10000
        hard: 16384

    extra_hosts:
      - "dockerhost:192.168.100.1"

  autotest-hostscheduler:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-autotest-host:${LABEL:-release}
    user: moblab
    restart: on-failure

    volumes:
      - logs:/var/log/moblab
      - logs:/moblab/third_party/autotest/logs
      - /etc/lsb-release:/etc/lsb-release:ro

    networks:
      - moblab

    depends_on:
      - autotest

  autotest-job_aborter:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-autotest-aborter:${LABEL:-release}
    user: moblab
    restart: on-failure

    volumes:
      - logs:/var/log/moblab
      - logs:/moblab/third_party/autotest/logs
      - /etc/lsb-release:/etc/lsb-release:ro
      - lucifer_leases:/usr/local/autotest/leases

    networks:
      - moblab

    depends_on:
      - autotest
  ##############################################################################
  envoy-proxy:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/envoy-proxy:${LABEL:-release}
    user: moblab
    restart: on-failure

    hostname: envoy-proxy
    volumes:
      - logs:/var/log/moblab

    networks:
      - moblab

    ports:
      - 6001:6001
      - 6011:6011
  ##############################################################################
  moblab-ui:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-ui:${LABEL:-release}
    hostname: moblab-ui

    networks:
      - moblab

    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/home/moblab/.service_account.json=

    ports:
      - 6010:6010
  ##############################################################################
  moblab-rpcserver:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-rpcserver:${LABEL:-release}
    user: moblab
    hostname: moblab-rpcserver

    volumes:
      - logs:/var/log/moblab
      - moblab_home:/home/moblab

    networks:
      - moblab

    depends_on:
      - autotest

    extra_hosts:
      - "dockerhost:192.168.100.1"

    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/home/moblab/.service_account.json
  ##############################################################################
  remote_agent:
    image: gcr.io/chromeos-partner-moblab/moblab-remote-agent:${LABEL:-release}
    user: moblab
    hostname: moblab-remote-agent
    restart: on-failure

    volumes:
      - logs:/var/log/moblab
      - moblab_home:/home/moblab

    networks:
      - moblab

    depends_on:
      - autotest

    extra_hosts:
      - "dockerhost:192.168.100.1"

    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/home/moblab/.service_account.json
  ##############################################################################
  watchtower:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/watchtower:${LABEL:-release}
    restart: on-failure
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    command: --interval 60

    networks:
      - moblab

    ulimits:
      nofile:
        soft: 10000
        hard: 16384
  ##############################################################################
  offloader:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-offloader:${LABEL:-release}
    restart: on-failure

    user: moblab

    volumes:
      - results:/usr/local/autotest/results
      - moblab_home:/home/moblab
      - logs:/var/log/moblab

    networks:
      - moblab

    command: >
      -l /var/log/moblab/offloader.log
      run
      --gs-bucket chromeos-moblab-peng-staging
      --credentials-file /home/moblab/.service_account.json
      --min-age-to-prune 1
      --jobs 100

    depends_on:
      - autotest

    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/home/moblab/.service_account.json

    ulimits:
      nofile:
        soft: 10000
        hard: 16384

    extra_hosts:
      - "dockerhost:192.168.100.1"
  ##############################################################################
  monitoring:
    image: google/cadvisor:latest
    restart: on-failure
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

    ports:
      - 9997:8080

    networks:
      - moblab
  ##############################################################################
  log-rotate:
    image: blacklabelops/logrotate:latest
    restart: on-failure
    volumes:
      - /var/log/bootup:/bootup
      - logs:/logs

    environment:
      - LOGS_DIRECTORIES=/bootup /var/log/docker /logs
      - LOGROTATE_INTERVAL=hourly

    networks:
      - moblab
  ##############################################################################
  remote_access:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/remote_access:${LABEL:-release}
    restart: on-failure
    volumes:
      - logs:/var/log/moblab
      - usr_local_moblab:/usr/local/moblab
      - static_cache:/mnt/moblab/cache
      - results:/mnt/moblab/results
      - containers:/mnt/moblab/containers
      - apache_logs:/var/log/apache
      - /var/log/bootup:/var/log/bootup
      - moblab_home:/home/moblab
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      - PUBLIC_KEY_FILE=/testing_rsa.pub
      - PUID=246
      - PGID=246
      - TZ=Etc/UTC
      - USER_NAME=moblab
      - DOCKER_MODS=linuxserver/mods:openssh-server-ssh-tunnel
      - SUDO_ACCESS=true

    ports:
      - 2222:2222

    networks:
      - moblab
##############################################################################
  remote-scheduler:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-remote-scheduler:${LABEL:-release}
    restart: on-failure
    volumes:
      - logs:/var/log/moblab
      - usr_local_moblab:/usr/local/moblab
      - moblab_home:/home/moblab

    networks:
      - moblab
##############################################################################
volumes:
  db_data: {}
  logs: {}
  moblab_home: {}
  usr_local_moblab: {}
  static_cache: {}
  results: {}
  lucifer_leases: {}
  containers: {}
  apache_logs: {}
  shadowconfig: {}
  leases:
    external: True

networks:
  moblab:
    ipam:
      driver: default
      config:
        - subnet: "192.168.100.0/24"
