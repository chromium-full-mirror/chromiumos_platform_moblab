version: "3"
services:
  ##############################################################################
  db:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-db:${DB:-release}
    hostname: db
    restart: on-failure
    user: moblab

    volumes:
      - logs:/var/log/moblab
      - db_data:/var/lib/mysql

    networks:
      moblab:
        aliases:
          - db

    environment:
      - MYSQL_ROOT_PASSWORD=moblab_db_passwd

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-uroot",
          "-pmoblab_db_passwd",
          "--silent",
        ]
      interval: 1m30s
      timeout: 10s
      retries: 3

    ulimits:
      nofile:
        soft: 10000
        hard: 16384
  ##############################################################################
  db-init:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-db-init:${DB_INIT:-release}
    user: moblab
    depends_on:
      - db

    networks:
      moblab:
  ##############################################################################
  devserver:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/devserver:${DEVSERVER:-release}
    hostname: devserver
    restart: on-failure
    user: moblab

    volumes:
      - logs:/var/log/moblab
      - moblab_home:/home/moblab
      - usr_local_moblab:/usr/local/moblab
      - static_cache:/static

    depends_on:
      - autotest

    networks:
      moblab:
        ipv4_address: 192.168.100.50
        aliases:
          - database
    ulimits:
      nofile:
        soft: 10000
        hard: 16384
  ##############################################################################
  autotest:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-autotest-afe:${AUTOTEST:-release}
    hostname: autotest
    restart: on-failure
    user: moblab
    ports:
      - 80:8888

    volumes:
      - logs:/var/log/moblab
      - usr_local_moblab:/usr/local/moblab
      - results:/usr/local/autotest/results
      - results:/results
      - moblab_home:/home/moblab
      - apache_logs:/var/log/apache2
      - leases:/leases:ro
      - /etc/lsb-release:/etc/lsb-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - shadowconfig:/shadow_config

    environment:
      - LABEL=${AUTOTEST}

    networks:
      - moblab

    depends_on:
      - autotest-dbsetup

    cap_add:
      - CAP_NET_BIND_SERVICE
      - CAP_NET_RAW
      - ALL

    ulimits:
      nofile:
        soft: 10000
        hard: 16384

    extra_hosts:
      - "dockerhost:192.168.100.1"

  autotest-dbsetup:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-autotest-dbsetup:${AT_DBSETUP:-release}
    user: moblab
    volumes:
      - logs:/var/log/moblab
      - logs:/usr/local/autotest/logs
      - /etc/lsb-release:/etc/lsb-release:ro

    networks:
      - moblab

    depends_on:
      - db-init

  autotest-monitordb:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-autotest-monitor_db:${AT_MONITORDB:-release}
    user: moblab
    restart: on-failure

    volumes:
      - logs:/var/log/moblab
      - logs:/moblab/third_party/autotest/logs
      - /etc/lsb-release:/etc/lsb-release:ro
      - results:/usr/local/autotest/results
      - lucifer_leases:/usr/local/autotest/leases
      - shadowconfig:/shadow_config
      - moblab_home:/home/moblab
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - containers:/moblab/third_party/autotest/containers

    networks:
      - moblab

    depends_on:
      - autotest

    cap_add:
      - CAP_NET_BIND_SERVICE
      - CAP_NET_RAW
      - ALL

    environment:
      - LABEL=$AT_MONITORDB

    ulimits:
      nofile:
        soft: 10000
        hard: 16384

    extra_hosts:
      - "dockerhost:192.168.100.1"

  autotest-hostscheduler:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-autotest-host:${AT_HOSTSCHEDULER:-release}
    user: moblab
    restart: on-failure

    volumes:
      - logs:/var/log/moblab
      - logs:/moblab/third_party/autotest/logs
      - /etc/lsb-release:/etc/lsb-release:ro

    networks:
      - moblab

    depends_on:
      - autotest

  autotest-job_aborter:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-autotest-aborter:${AT_JOBABORTER:-release}
    user: moblab
    restart: on-failure

    volumes:
      - logs:/var/log/moblab
      - logs:/moblab/third_party/autotest/logs
      - /etc/lsb-release:/etc/lsb-release:ro
      - lucifer_leases:/usr/local/autotest/leases

    cap_add:
      - CAP_NET_BIND_SERVICE
      - CAP_NET_RAW
      - ALL

    networks:
      - moblab

    depends_on:
      - autotest
  ##############################################################################
  envoy-proxy:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/envoy-proxy:${ENVOYPROXY:-release}
    user: moblab
    restart: on-failure

    hostname: envoy-proxy
    volumes:
      - logs:/var/log/moblab

    networks:
      - moblab

    ports:
      - 6001:6001
      - 6011:6011
  ##############################################################################
  moblab-ui:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-ui:${MOBLAB_UI:-release}
    hostname: moblab-ui

    networks:
      - moblab

    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/home/moblab/.service_account.json

    ports:
      - 6010:6010
  ##############################################################################
  moblab-rpcserver:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-rpcserver:${MOBLAB_RPCSERVER:-release}
    user: moblab
    hostname: moblab-rpcserver

    volumes:
      - logs:/var/log/moblab
      - moblab_home:/home/moblab
      - leases:/leases:ro

    networks:
      - moblab

    depends_on:
      - autotest

    extra_hosts:
      - "dockerhost:192.168.100.1"

    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/home/moblab/.service_account.json
  ##############################################################################
  remote_agent:
    image: gcr.io/chromeos-partner-moblab/moblab-remote-agent:${REMOTE_AGENT:-release}
    user: moblab
    hostname: moblab-remote-agent
    restart: on-failure

    volumes:
      - logs:/var/log/moblab
      - moblab_home:/home/moblab

    networks:
      - moblab

    depends_on:
      - autotest

    extra_hosts:
      - "dockerhost:192.168.100.1"

    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/home/moblab/.service_account.json
  ##############################################################################
  watchtower:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/watchtower:${WATCHTOWER:-release}
    restart: on-failure
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    command: ${WATCHTOWER_CMD}

    networks:
      - moblab

    ulimits:
      nofile:
        soft: 10000
        hard: 16384
  ##############################################################################
  offloader:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-offloader:${OFFLOADER:-release}
    restart: on-failure

    user: moblab

    volumes:
      - results:/usr/local/autotest/results
      - moblab_home:/home/moblab
      - logs:/var/log/moblab

    networks:
      - moblab

    depends_on:
      - autotest

    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/home/moblab/.service_account.json

    ulimits:
      nofile:
        soft: 10000
        hard: 16384

    extra_hosts:
      - "dockerhost:192.168.100.1"
  ##############################################################################
  monitoring:
    image: google/cadvisor:latest
    restart: on-failure
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

    ports:
      - 9997:8080

    networks:
      - moblab
  ##############################################################################
  log-rotate:
    image: blacklabelops/logrotate:latest
    restart: on-failure
    volumes:
      - /var/log/bootup:/bootup
      - logs:/logs

    environment:
      - LOGS_DIRECTORIES=/bootup /var/log/docker /logs
      - LOGROTATE_INTERVAL=yearly
      - LOGROTATE_SIZE=50M

    networks:
      - moblab
  ##############################################################################
  remote_access:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/remote_access:${REMOTE_ACCESS:-release}
    restart: on-failure
    volumes:
      - logs:/var/log/moblab
      - usr_local_moblab:/usr/local/moblab
      - static_cache:/mnt/moblab/cache
      - results:/mnt/moblab/results
      - containers:/mnt/moblab/containers
      - apache_logs:/var/log/apache
      - /var/log/bootup:/var/log/bootup
      - moblab_home:/home/moblab
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/local/tmp:/usr/local/tmp
      - leases:/leases:ro

    depends_on:
      - autotest

    environment:
      - PUBLIC_KEY_FILE=/testing_rsa.pub
      - PUID=246
      - PGID=246
      - TZ=Etc/UTC
      - USER_NAME=moblab
      - DOCKER_MODS=linuxserver/mods:openssh-server-ssh-tunnel
      - SUDO_ACCESS=true

    ports:
      - "${SSH_PORT}:2222"

    networks:
      - moblab
##############################################################################
  remote-scheduler:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/moblab-remote-scheduler:${REMOTE_SCHEDULER:-release}
    restart: always
    volumes:
      - logs:/var/log/moblab
      - usr_local_moblab:/usr/local/moblab
      - moblab_home:/home/moblab

    depends_on:
      - autotest

    networks:
      - moblab

##############################################################################

  mobmonitor:
    image: ${REGISTRY_URI:-gcr.io/chromeos-partner-moblab}/mobmonitor:${MOBMONITOR:-release}
    user:  moblab

    volumes:
      - logs:/var/log/moblab
      - apache_logs:/var/log/apache:ro
      - moblab_home:/home/moblab:ro
      - /var/log/bootup:/var/log/bootup:ro
      - leases:/leases:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /etc/lsb-release:/etc/lsb-release:ro

    networks:
      - moblab

    ports:
      - 9991:9991

    extra_hosts:
      - "dockerhost:192.168.100.1"

    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/home/moblab/.service_account.json

##############################################################################
volumes:
  db_data: {}
  logs: {}
  moblab_home: {}
  usr_local_moblab: {}
  static_cache: {}
  results: {}
  lucifer_leases: {}
  containers: {}
  apache_logs: {}
  shadowconfig: {}
  leases:
    external: True

networks:
  moblab:
    ipam:
      driver: default
      config:
        - subnet: "192.168.100.0/24"
