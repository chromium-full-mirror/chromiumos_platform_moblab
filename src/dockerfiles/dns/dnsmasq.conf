#  dnsmasq config, for a complete example, see:
#  http://oss.segetech.com/intra/srv/dnsmasq.conf

log-facility=/var/log/dns.log
#log all dns queries
log-queries

#dont use hosts nameservers
no-resolv

cache-size=500

# Google DNS - https://developers.google.com/speed/public-dns/docs/using
server=8.8.8.8
server=8.8.4.4

# Cloudflare DNS - https://1.1.1.1/dns/
server=1.0.0.1
server=1.1.1.1

# Open DNS - https://use.opendns.com/
server=208.67.222.222
server=208.67.220.220

# Quad 9 DNS https://www.quad9.net/
server=9.9.9.9
server=149.112.112.112

# Neustar https://www.home.neustar/dns-services
server=56.154.70.5
server=156.154.71.5

# Comodo https://www.comodo.com/secure-dns/
server=8.26.56.26
server=8.20.247.20

# Norton DNS
server=199.85.126.10
server=199.85.127.10
