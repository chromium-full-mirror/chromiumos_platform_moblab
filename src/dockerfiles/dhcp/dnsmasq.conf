#log all dns queries
log-queries

#dont use hosts nameservers
no-resolv

server=8.8.4.4
server=1.0.0.1
server=8.8.8.8
server=1.1.1.1

dhcp-range=192.168.231.10,192.168.231.250,400h
dhcp-broadcast
