      ]
    waitFor:
      - "autotest-base"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: db
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--no-cache",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/db/Dockerfile",
        "-t",
        "${_REGISTRY_URI}/moblab-db:${_LABEL}",
        "/workspace/src/dockerfiles/db",
      ]
    env:
      - "DOCKER_BUILDKIT=1"

  - id: db-init
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--no-cache",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/db/Dockerfile.db_init",
        "-t",
        "${_REGISTRY_URI}/moblab-db-init:${_LABEL}",
