substitutions:
  _REGISTRY_URI: gcr.io/chromeos-partner-moblab
  _LABEL: beta
  _WATCHTOWER_CMD: "--interval 3600 --monitor-only"
  _SSH_PORT: "22"

steps:
  - id: pull
    name: "docker:19.03.8"
    args: ["pull", "debian:buster-slim"]
  - id: pull2
    name: "docker:19.03.8"
    args: ["pull", "alpine/git"]
  - id: pull3
    name: "docker:19.03.8"
    args: ["pull", "docker/dockerfile-copy:v0.1.9"]
  - id: pull4
    name: "docker:19.03.8"
    args: ["pull", "debian:buster"]
  - id: pull5
    name: "docker:19.03.8"
    args: ["pull", "python:2.7-slim-buster"]
  - id: pull6
    name: "docker:19.03.8"
    args: ["pull", "mariadb:10.2"]
  - id: pull7
    name: "docker:19.03.8"
    args: ["pull", "python:3.8-slim-buster"]
  - id: pull8
    name: "docker:19.03.8"
    args: ["pull", "python:3.8-buster"]
  - id: pull9
    name: "docker:19.03.8"
    args: ["pull", "envoyproxy/envoy:v1.14.1"]
  - id: pull10
    name: "docker:19.03.8"
    args: ["pull", "linuxserver/openssh-server"]
  - id: pull11
    name: "docker:19.03.8"
    args: ["pull", "v2tec/watchtower:latest"]
  - id: pull12
    name: "docker:19.03.8"
    args: ["pull", "docker/compose:alpine-1.25.4"]

  - id: protoc
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--no-cache",
        "-f",
        "/workspace/src/dockerfiles/utilities/Dockerfile.protoc",
        "-t",
        "${_REGISTRY_URI}/protoc:${_LABEL}",
        "/workspace/src/dockerfiles/utilities/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-lucifer
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--no-cache",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.lucifer",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-lucifer:${_LABEL}",
        "/workspace/src/dockerfiles/autotest/",
      ]
    waitFor:
      - "protoc"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-gwt
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--no-cache",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.gwt",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-gwt:${_LABEL}",
        "/workspace/",
      ]
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-base
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--no-cache",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.base",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-base:${_LABEL}",
        "/workspace/",
      ]
    waitFor:
      - "protoc"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-afe
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--no-cache",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
        "-f",
        "/workspace/src/dockerfiles/autotest/Dockerfile.afe",
        "-t",
        "${_REGISTRY_URI}/moblab-autotest-afe:${_LABEL}",
        "/workspace/src/dockerfiles/autotest",
      ]
    waitFor:
      - "autotest-base"
      - "autotest-gwt"
    env:
      - "DOCKER_BUILDKIT=1"

  - id: autotest-dbsetup
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--no-cache",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
        "--build-arg",
        "LABEL=${_LABEL}",
