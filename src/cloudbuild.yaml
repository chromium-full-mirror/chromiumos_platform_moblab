      ]
    env:
      - "DOCKER_BUILDKIT=1"

  - id: devserver
    name: "docker:19.03.8"
    args:
      [
        "build",
        "--no-cache",
        "--build-arg",
        "REGISTRY_URI=${_REGISTRY_URI}",
